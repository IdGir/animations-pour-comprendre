<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Exposés</title>
<style>
:root{
  --ink:#1F2633;--ink2:#566074;--line:#E1DCD0;--bg:#F6F3EC;--paper:#fff;
  --acc:#2F5DA8;--acc2:#E3EBF8;--ok:#2E8B57;--ok2:#E3F4EA;--warn:#B8650F;--warn2:#FDF0DF;--err:#C0392B;--err2:#FCE8E6;
  --c1:#FFE36E;--c2:#A3E6B6;--c3:#AFD6FF;--r:16px;
  --h:#A8431F;--g:#1C6E61;--s:#2856A8;--a:#6B4FA0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:18px/1.45 "Segoe UI","Trebuchet MS",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--acc2)}
.btn.plein{background:var(--acc);color:#fff}.btn.plein:hover{filter:brightness(1.08)}
.btn.vert{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--err);color:var(--err)}.btn.danger:hover{background:var(--err2)}
.btn.petit{min-height:36px;padding:0 12px;font-size:15px;border-radius:10px}
.btn.discret{border-color:var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:hover{border-color:var(--acc);background:var(--acc2)}
.ib.petit{width:34px;height:34px;font-size:16px;border-radius:9px}
.hidden{display:none!important}
.muted{color:var(--ink2)}
.carte{background:var(--paper);border-radius:var(--r);padding:20px 22px;box-shadow:0 1px 4px rgba(31,38,51,.08);border:1px solid var(--line)}
.carte h2{font-size:22px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.carte h2 .pastille{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.champ{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;flex:1;min-width:160px}
.champ>span{font-weight:700;font-size:16px;color:var(--ink2)}
.champ input,.champ select,.champ textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.champ input:focus,.champ select:focus,.champ textarea:focus,textarea:focus,input:focus{outline:3px solid var(--acc2);border-color:var(--acc)}
.ligne{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-size:16px;font-weight:600}
.chip:hover,.chip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.badge{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;color:#fff;background:var(--a)}
.badge.histoire{background:var(--h)}.badge.geographie{background:var(--g)}.badge.sciences{background:var(--s)}
.ex-carte .badge,.cata .badge{align-self:flex-start}
.vide{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink2)}

/* ---------- accueil ---------- */
.accueil{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
.acc-top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:14px;flex:1}
.logo h1{font-size:34px;letter-spacing:-.01em}
.logo small{display:block;font-size:17px;font-weight:500;color:var(--ink2)}
.entrees{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:34px}
.entree{display:flex;flex-direction:column;gap:10px;text-align:left;border:3px solid transparent;background:#fff;border-radius:22px;padding:24px;box-shadow:0 2px 8px rgba(31,38,51,.08);min-height:220px}
.entree:hover{border-color:var(--acc);transform:translateY(-2px)}
.entree .pic{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.entree b{font-size:23px}
.entree span{color:var(--ink2);font-size:17px}
.liste-exposes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ex-carte{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--a)}
.ex-carte.histoire{border-top-color:var(--h)}.ex-carte.geographie{border-top-color:var(--g)}.ex-carte.sciences{border-top-color:var(--s)}
.ex-carte b{font-size:19px}
.prog{height:8px;border-radius:9px;background:#ECE8DE;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}

/* ---------- projet ---------- */
#app{height:100%}
.projet{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line)}
.ptitre{min-width:120px;max-width:240px;overflow:hidden}
.ptitre b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}
.ptitre small{display:block;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{flex:1;display:flex;justify-content:center;gap:4px;align-items:center;min-width:0}
.step{display:flex;align-items:center;gap:7px;border:none;background:none;padding:6px 8px;border-radius:12px;font-weight:700;color:var(--ink2);font-size:15px;white-space:nowrap}
.step .n{width:34px;height:34px;border-radius:50%;border:3px solid #CFC8B8;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:#fff;flex:none}
.step.fait .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur{background:var(--acc2);color:var(--acc)}
.step.cur .n{border-color:var(--acc);background:var(--acc);color:#fff}
.step:hover{background:#F1EEE6}
.sep{width:18px;height:3px;background:#DDD6C6;border-radius:2px;flex:none}
.consigne{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--acc2);border-bottom:1px solid #CFDCF1}
.consigne p{margin:0;flex:1;font-size:19px;font-weight:600}
.consigne .nav{display:flex;gap:8px}
main.etape{flex:1;min-height:0;overflow:auto;padding:16px}
.col-unique{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.q-ligne,.p-ligne{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.q-ligne input,.p-ligne input{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.p-ligne .num{width:36px;height:36px;border-radius:10px;background:var(--acc2);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.p-ligne.special .num{background:#EFEBE2;color:var(--ink2)}
.anim-carte{display:flex;gap:16px;align-items:center;padding:14px;border-radius:14px;background:#F8F6F1;border:2px solid var(--line)}
.anim-vign{width:120px;height:68px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;background:var(--a)}
.anim-vign.histoire{background:linear-gradient(135deg,var(--h),#D9895F)}.anim-vign.geographie{background:linear-gradient(135deg,var(--g),#58A99A)}.anim-vign.sciences{background:linear-gradient(135deg,var(--s),#6E97DB)}
.info{padding:10px 14px;border-radius:12px;background:var(--warn2);color:#7A4208;font-weight:600;font-size:16px}
.info.ok{background:var(--ok2);color:#185C36}
.info.bleu{background:var(--acc2);color:#1D3F78}

/* ---------- étape 2 : chercher ---------- */
.chercher{display:grid;grid-template-columns:300px minmax(0,1fr) 310px;gap:14px;height:100%}
.panneau{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panneau>h3{font-size:18px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panneau .defile{flex:1;overflow:auto;padding:12px}
.rech{display:flex;gap:6px}
.rech input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:9px 12px}
.src-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;border:2px solid transparent;cursor:pointer;margin-bottom:4px}
.src-item:hover{background:#F6F3EC}.src-item.on{border-color:var(--acc);background:var(--acc2)}
.src-item .t{flex:1;font-weight:600;font-size:16px;line-height:1.25}
.src-item small{display:block;color:var(--ink2);font-weight:500;font-size:13px}
.lecteur{font-size:19px;line-height:1.6}
.lecteur .contenu{max-width:820px;margin:0 auto;padding:4px 10px 40px}
.lecteur .contenu h2{font-size:24px;margin:22px 0 8px}.lecteur .contenu h3{font-size:20px;margin:18px 0 6px}
.lecteur .contenu img{max-width:100%;height:auto}
.lecteur .contenu table{border-collapse:collapse;font-size:16px;margin:10px 0;max-width:100%}
.lecteur .contenu td,.lecteur .contenu th{border:1px solid #CBC5B8;padding:4px 8px;vertical-align:top}
.lecteur .contenu th{background:#F3F0E8}
.lecteur .contenu .wl{color:var(--acc);text-decoration:underline;cursor:pointer}
.lecteur .contenu figure,.lecteur .contenu .thumb,.lecteur .contenu .tright,.lecteur .contenu .tleft{margin:10px 0}
.lecteur .contenu .thumbcaption,.lecteur .contenu figcaption{font-size:15px;color:var(--ink2)}
.figw{position:relative;display:inline-block;max-width:100%}
.tabw{position:relative;padding-top:42px;margin:12px 0;overflow-x:auto}
.garder{position:absolute;z-index:3;top:6px;left:6px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-weight:800;font-size:15px;padding:6px 12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.garder.ok{background:var(--ok)}
mark.hl{border-radius:3px;padding:1px 0;color:inherit}
mark.c1{background:var(--c1)}mark.c2{background:var(--c2)}mark.c3{background:var(--c3)}
.src-tete{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.src-tete .t{flex:1;min-width:200px}
.src-tete b{font-size:20px;display:block}
.resultat{padding:12px 14px;border-radius:12px;border:2px solid var(--line);margin-bottom:10px;cursor:pointer;background:#fff}
.resultat:hover{border-color:var(--acc);background:var(--acc2)}
.resultat b{font-size:19px;color:var(--acc)}
.resultat p{margin:4px 0 0;font-size:16px;color:var(--ink2)}
.img-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.img-res{background:#F8F6F1;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.img-res img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#E7E3D9}
.img-res small{font-size:12px;color:var(--ink2);line-height:1.25}
.etape-anim{border-left:6px solid var(--acc);padding:6px 14px;margin:14px 0;background:#FAF8F3;border-radius:0 12px 12px 0}
.etape-anim h3{font-size:19px;margin:4px 0}
#bulle{position:fixed;z-index:50;display:flex;gap:6px;background:var(--ink);padding:7px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#bulle button{border:none;border-radius:10px;padding:7px 12px;font-weight:800;font-size:15px;color:var(--ink)}
#bulle .c1{background:var(--c1)}#bulle .c2{background:var(--c2)}#bulle .c3{background:var(--c3)}#bulle .lire{background:#fff}
.tr{display:flex;gap:8px;padding:8px;border-radius:12px;background:#FAF8F3;border:2px solid var(--line);margin-bottom:8px;position:relative;font-size:15px;line-height:1.35}
.tr .barre{width:7px;border-radius:4px;flex:none;background:#C9C2B2}
.tr.c1 .barre{background:#F2C200}.tr.c2 .barre{background:#3FAE62}.tr.c3 .barre{background:#4F98E6}
.tr .corps{flex:1;min-width:0}
.tr .corps .txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tr .corps small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.tr img{width:100%;max-height:110px;object-fit:cover;border-radius:8px;display:block}
.tr .mini-tab{max-height:90px;overflow:hidden;font-size:9px;pointer-events:none}
.tr .mini-tab table{border-collapse:collapse}.tr .mini-tab td,.tr .mini-tab th{border:1px solid #bbb;padding:1px 3px}
.tr .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:none;background:#fff;color:var(--ink2);font-size:14px;opacity:.8}
.tr .x:hover{background:var(--err2);color:var(--err)}
.tr.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.legende-c{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
.legende-c span{padding:2px 8px;border-radius:6px;font-weight:700}

/* ---------- étape 3 : trier ---------- */
.trier{display:flex;gap:14px;height:100%;overflow-x:auto;padding-bottom:6px;align-items:stretch}
.colonne{flex:0 0 280px;background:#fff;border:2px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.colonne.arang{background:#FBFAF6;border-style:dashed}
.colonne.cible{border-color:var(--acc);background:var(--acc2)}
.colonne.cliquable{cursor:pointer;border-color:var(--acc)}
.colonne h3{font-size:17px;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.colonne h3 .num{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.colonne .defile{flex:1;overflow:auto;padding:10px}
.colonne .compte{margin-left:auto;font-size:14px;color:var(--ink2);font-weight:600}

/* ---------- étape 4 : écrire ---------- */
.ecrire{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:14px;height:100%}
.part-nav{display:flex;flex-direction:column;gap:6px}
.part-nav button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;font-size:16px}
.part-nav button.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.part-nav .prog{margin-top:6px;height:6px}
.editeur{display:flex;flex-direction:column;gap:10px;min-height:0}
.editeur .titre-p{font-size:24px;font-weight:800;border:2px solid transparent;border-radius:12px;padding:6px 10px;background:transparent}
.editeur .titre-p:hover{border-color:var(--line);background:#fff}
#txt{flex:1;min-height:260px;resize:none;border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;font-size:21px;line-height:1.7;background:#fff}
.compteur{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.compteur .prog{flex:1;min-width:120px;height:10px}
.verif-item{border-radius:12px;padding:10px 12px;background:#fff;border:2px solid var(--line);margin-bottom:8px;font-size:16px}
.verif-item.ortho{border-color:#E9A79F;background:#FFF7F6}
.verif-item.style{border-color:#E8C48B;background:#FFFBF3}
.verif-item.copie{border-color:#C9B2E8;background:#FAF6FF}
.verif-item q{font-style:normal;font-weight:700;background:#FFE1DC;border-radius:4px;padding:0 3px}
.verif-item .sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lex-ligne{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:12px;background:#F4F9FF;border:2px solid #CFE3F8;margin-bottom:8px}
.lex-ligne input,.lex-ligne textarea{border:1.5px solid #CFE3F8;border-radius:8px;padding:6px 8px;font-size:15px;width:100%;resize:vertical}

/* ---------- étape 5 : diaporama ---------- */
.diapo{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:14px;height:100%}
.miniatures{display:flex;flex-direction:column;gap:10px}
.mini{border:3px solid transparent;border-radius:12px;padding:3px;background:none;position:relative;text-align:left}
.mini.on{border-color:var(--acc)}
.mini .no{position:absolute;top:8px;left:8px;z-index:2;background:rgba(31,38,51,.75);color:#fff;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px}
.sbox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sbox>.slide{position:absolute;top:0;left:0;transform-origin:0 0}
.apercu-zone{display:flex;flex-direction:column;gap:10px;min-height:0;justify-content:flex-start}
.apercu-zone .sbox{border-radius:14px}
.media-choix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:280px;overflow:auto;padding:2px}
.media-choix button{border:3px solid var(--line);border-radius:10px;background:#fff;padding:4px;height:82px;overflow:hidden;font-size:12px;line-height:1.2;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.media-choix button.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.media-choix img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.media-choix .ty{position:absolute;bottom:3px;right:3px;background:rgba(31,38,51,.75);color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:0 5px}

/* ---------- diapositive (1600 × 900) ---------- */
.slide{width:1600px;height:900px;background:#fff;color:#1F2633;font-family:"Segoe UI","Trebuchet MS",system-ui,Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;--th:#6B4FA0;--th2:#EEE8F7}
.slide.histoire{--th:#A8431F;--th2:#F6E7DB}.slide.geographie{--th:#1C6E61;--th2:#DCEFEA}.slide.sciences{--th:#2856A8;--th2:#E1EAF8}
.slide .bandeau{background:var(--th);color:#fff;padding:34px 60px;font-size:62px;font-weight:800;line-height:1.1;flex:none}
.slide .corps{flex:1;display:flex;gap:46px;padding:46px 60px 40px;min-height:0}
.slide .texte{flex:1;font-size:46px;line-height:1.35;font-weight:600;display:flex;flex-direction:column;justify-content:center;min-width:0}
.slide .texte ul{margin:0;padding-left:56px}.slide .texte li{margin-bottom:22px}.slide .texte li::marker{color:var(--th)}
.slide .texte .ph{color:#A8A398;font-style:italic;font-weight:500}
.slide .media{flex:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0}
.slide .media img{max-width:100%;max-height:640px;object-fit:contain;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.slide .media .cred{font-size:20px;color:#6A7184;margin-top:12px;text-align:center;max-width:100%}
.slide .media .tabw{padding:0;margin:0;font-size:26px;max-height:640px;overflow:hidden}
.slide .media table{border-collapse:collapse}.slide .media td,.slide .media th{border:2px solid #C4BEB1;padding:8px 14px}.slide .media th{background:var(--th2)}
.slide .media blockquote{margin:0;font-size:40px;line-height:1.4;background:var(--th2);border-left:14px solid var(--th);padding:30px 36px;border-radius:0 20px 20px 0;font-style:italic}
.slide .media blockquote cite{display:block;margin-top:16px;font-size:24px;font-style:normal;color:#5A6175}
.slide .anim-ph{width:100%;height:100%;border-radius:18px;background:linear-gradient(135deg,var(--th),#333);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:40px;font-weight:800;text-align:center;padding:30px}
.slide .anim-ph .rond{width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:76px;padding-left:12px}
.slide .anim-ph small{font-size:28px;font-weight:600;opacity:.9}
.slide .media iframe{width:100%;height:100%;border:none;border-radius:18px;background:#fff}
.slide.l-media .corps{flex-direction:column;gap:20px}
.slide.l-media .texte{flex:none;font-size:38px}
.slide.l-media .texte ul{display:flex;gap:40px;flex-wrap:wrap;list-style:none;padding:0}
.slide.l-media .media{flex:1}
.slide.k-titre{background:linear-gradient(160deg,var(--th2) 0%,#fff 60%)}
.slide.k-titre .bloc-titre{flex:1;display:flex;align-items:center;gap:60px;padding:60px 90px}
.slide.k-titre .bloc-titre .tt{flex:1.2}

}

 get(k){ if(!this.db) return Promise.resolve(this.mem[k]); return new Promise(res=>{ const q=this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); });},
 set(k,v){ if(!this.db){this.mem[k]=v;return Promise.resolve();} return new Promise(res=>{ const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>{toast("Enregistrement impossible (mémoire pleine ?)","warn");res();}; });},
 del(k){ if(!this.db){delete this.mem[k];return Promise.resolve();} return new Promise(res=>{ const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });},
 keys(){ if(!this.db) return Promise.resolve(Object.keys(this.mem)); return new Promise(res=>{ const q=this.db.transaction("kv").objectStore("kv").getAllKeys(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); });}

/* ---------- utilitaires animations ---------- */
const LIT=String.raw`("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\`(?:\\.|[^\`\\])*\`)`;
function unq(s){ if(s[0]==='"'){ try{return JSON.parse(s);}catch(e){} } return s.slice(1,-1).replace(/\\n/g,"\n").replace(/\\u([0-9a-fA-F]{4})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\(.)/g,"$1"); }
function extraireAnim(html,id){
  let meta={}; const mm=html.match(/\/\*\s*META\s*(\{[\s\S]*?\})\s*\*\//); if(mm){ try{meta=JSON.parse(mm[1]);}catch(e){} }
  let i0=html.indexOf("Anim.run("); if(i0<0) i0=mm?mm.index:0; let part=html.slice(i0);
  if(!/\blegende\s*:/.test(part)){ const j=mm?mm.index:html.lastIndexOf("<script>"); if(j>=0) part=html.slice(j); }
  const reT=new RegExp(String.raw`\btitre\s*:\s*`+LIT,"g"), reL=new RegExp(String.raw`\blegende\s*:\s*`+LIT,"g"), reS=new RegExp(String.raw`\bsousTitre\s*:\s*`+LIT), reM=new RegExp(String.raw`\bmatiere\s*:\s*`+LIT);
  const titres=[...part.matchAll(reT)].map(m=>({i:m.index,v:unq(m[1])}));
  const ie=Math.max(0,part.indexOf("etapes"));
  let prev=ie; const etapes=[...part.matchAll(reL)].filter(m=>m.index>ie).map(m=>{ const t=titres.filter(x=>x.i>prev&&x.i<m.index).pop(); prev=m.index; return {titre:t?t.v:"",legende:unq(m[1])}; });
  const sous=part.match(reS), mat=part.match(reM), tt=html.match(/<title>([^<]*)<\/title>/);
  return {id:meta.id||id,titre:(titres[0]&&titres[0].i<ie?titres[0].v:"")||(tt?tt[1]:id),sousTitre:sous?unq(sous[1]):"",matiere:meta.matiere||(mat?unq(mat[1]):"")||"autre",resume:meta.resume||"",motsCles:meta.motsCles||[],etapes};
}

function animInfo(id){ return S.animIndex[id]||CATA.find(a=>a.id===id)||{id,titre:id,matiere:"autre"}; }
function catalogueComplet(){ const m=new Map(CATA.map(a=>[a.id,{...a}])); for(const id in S.animIndex) m.set(id,{...m.get(id),...S.animIndex[id]}); return [...m.values()]; }
async function chargerAnimEtapes(id){ // renvoie l'info avec étapes si possible

  return null; }
async function enregistrerAnim(html,idFichier){ const info=extraireAnim(html,idFichier); info.id=idFichier; await DB.set("anim:"+idFichier,{html}); S.animIndex[idFichier]={id:idFichier,titre:info.titre,sousTitre:info.sousTitre,matiere:info.matiere,resume:info.resume,motsCles:info.motsCles,etapes:info.etapes}; await DB.set("animIndex",S.animIndex); return S.animIndex[idFichier]; }
async function cadreAnim(id,etape,auto){ // iframe d'animation, positionnée à l'étape demandée si possible
  const f=document.createElement("iframe"); f.className="anim-frame"; f.setAttribute("allowfullscreen",""); f.title="Animation";

  else f.src=S.settings.dossierAnimations+id+".html";
  f.addEventListener("load",()=>{ if(etape==null||etape<0) return; setTimeout(()=>{ try{ const a=f.contentWindow.__anim; if(!a) return; if(auto) a.jump(etape); else a.setT(etape,0); }catch(e){} },150); });
  return f; }

const court=(t,n)=>{ t=String(t||"").trim(); n=n||38; return t.length>n?t.slice(0,n-1)+"…":t; };
const objMots=x=>x.kind==="partie"?S.settings.motsMin:15;
const tropMots=d=>!(d.sommaire||d.lex||d.titre==="Nos questions")&&nbMots(d.texte)>S.settings.diapoMotsMax;


/* =====================================================================
   INTERFACE SIMPLE (par défaut) : 3 étapes, une question à la fois
   ===================================================================== */
const simple=()=>S.settings&&S.settings.interface!=="complete";
const ETAPES_S=[{court:"Mon sujet",c:0},{court:"Mes réponses",c:1},{court:"Je présente",c:4}];
function libQuestion(x){ return x.kind==="intro"?"Introduction":x.kind==="conclusion"?"Conclusion":"Question "+(partiesNormales(S.p).indexOf(x)+1); }
function sousDefaut(x){ return x&&x.texte.trim()?"ecrire":"chercher"; }
function moteursS(){ return ["texte","image","anim"].flatMap(t=>sourcesDuType(t).filter(x=>!x.perso).map(x=>[x.k,x.nom])); }
function moteurSimple(){ const ts=["texte","image","anim"].filter(t=>sourcesDuType(t).some(x=>!x.perso)); if(!ts.length) return;
  if(!ts.includes(S.rech.type)) S.rech.type=ts[0]; const l=sourcesDuType(S.rech.type).filter(x=>!x.perso); if(!l.find(x=>x.k===S.rech.moteur)) S.rech.moteur=l[0].k; }
function etapeFaiteS(n){ const p=S.p, st=S.settings, pn=partiesNormales(p); switch(n){
  case 1: return !!p.titre.trim()&&!!p.auteurs.trim()&&pn.length>=st.partiesMin&&pn.every(x=>x.titre.trim());
  case 2: return p.parties.length>0&&p.parties.every(x=>nbMots(x.texte)>=objMots(x));
  case 3: return !!p.presente||Object.keys(p.autoeval||{}).length>0; } }
function rangerSimple(){ const p=S.p; const ids=new Set(p.parties.map(x=>x.id)); if(!S.partie||!ids.has(S.partie)) return; let ch=false;
  p.trouvailles.forEach(t=>{ if(!t.partie||!ids.has(t.partie)){ t.partie=S.partie; ch=true; } }); if(ch) sauver(); }
function motsAuto(){ const p=S.p; p.diapos.forEach(d=>{ const x=d.partie&&p.parties.find(q=>q.id===d.partie); if(!x||!x.texte.trim()||x.kind==="intro") return;
  if(d.texte.trim()&&!(d.autoTexte&&d.texte===d.autoTexte)) return; const g=motsClesDe(x.texte).join("\n"); if(g){ d.texte=g; d.autoTexte=g; } }); sauver(); }
function preparerS(n){ const p=S.p;
  if(n===2){ if(!p.parties.find(x=>x.id===S.partie)){ const inc=p.parties.find(x=>nbMots(x.texte)<objMots(x)); S.partie=(inc||p.parties[0]||{}).id; }
    S.sous=sousDefaut(p.parties.find(x=>x.id===S.partie)); rangerSimple(); }
  if(n===3){ synchroDiapos(); motsAuto(); } }

function guideSimple(){ const p=S.p, st=S.settings, n=S.etape, pn=partiesNormales(p); const G=(msg,btn,pret)=>({msg,btn:btn||null,pret:!!pret});
  if(n===1){
    if(!p.matiere) return G("Choisis la matière de ton exposé.");
    if(M("sujets")&&p.matiere!=="autre"&&(!p.sujet||S.listeSujets)) return G("Choisis ton sujet dans la liste.");
    if(!p.titre.trim()) return G("Écris le titre de ton exposé.");
    if(!p.auteurs.trim()) return G("Écris ton prénom.");
    if(pn.length<st.partiesMin) return G(`Il faut au moins ${st.partiesMin} questions.`,{t:"+ Une question",act:"ajoutP"});
    if(pn.some(x=>!x.titre.trim())) return G("Écris tes questions : ce que tu veux savoir sur ton sujet.");
    return G("Bravo ! Maintenant, cherche les réponses à tes questions.",{t:"C'est parti →",act:"etape",d:{n:2}},true); }
  if(n===2){
    const x=p.parties.find(q=>q.id===S.partie)||p.parties[0]; if(!x) return G("Écris d'abord tes questions.",{t:"← Mon sujet",act:"etape",d:{n:1}});
    const garde=p.trouvailles.filter(t=>t.partie===x.id&&estIdee(t)).length, o=objMots(x), nb=nbMots(x.texte); const ty=S.rech.type||"texte";
    const fini=q=>nbMots(q.texte)>=objMots(q)&&q.verifie; const i=p.parties.indexOf(x);
    const suiv=[...p.parties.slice(i+1),...p.parties.slice(0,i)].find(q=>!fini(q));
    if(S.sous!=="ecrire"){
      if(!garde) return G(ty==="image"?"Choisis une image qui t'aide, puis clique sur ⭐ Je garde.":ty==="anim"?"Regarde une animation, puis clique sur ⭐ Je garde.":sourceCourante()?"Sélectionne une phrase qui répond à la question, puis clique sur ⭐ Je garde.":"Clique sur un résultat pour le lire. Tu peux aussi choisir 🖼️ Images ou 🎞️ Animations.");
      return G(`Tu as gardé ${garde} idée${garde>1?"s":""}. Quand tu en as assez, écris ta réponse.`,{t:"✏️ J'écris ma réponse",act:"sous",d:{v:"ecrire"}},true); }
    if(nb<o) return G(`Réponds à la question avec tes mots. Encore ${o-nb} mot${o-nb>1?"s":""} !`);
    if(!x.verifie) return G("Super ! Fais relire ton texte par l'ordinateur.",{t:"✔ Vérifier mon texte",act:"verifier"});
    if(suiv) return G("Cette question est terminée ✓",{t:suiv.kind==="partie"?"Question suivante →":"Partie suivante →",act:"allerQuestion",d:{id:suiv.id}},true);
    return G("Tu as répondu à toutes tes questions. Bravo !",{t:"Je prépare mon exposé →",act:"etape",d:{n:3}},true); }
  const manque=p.parties.find(q=>nbMots(q.texte)<objMots(q));
  if(manque) return G(`Il manque ta réponse à « ${court(manque.titre||libQuestion(manque))} ».`,{t:"Finir cette question",act:"allerQuestion",d:{id:manque.id}});
  const trop=p.diapos.findIndex(tropMots);
  if(trop>=0) return G(`La diapo ${trop+1} a trop de mots : garde seulement l'essentiel.`,trop===S.diapo?null:{t:`Voir la diapo ${trop+1}`,act:"diapo",d:{i:trop}});
  return G("Ton exposé est prêt ! Regarde tes diapos, puis présente-le.",{t:"▶ Présenter",act:"presenter"},true); }

function typesRech(){ return [["texte","📄","Textes"],["image","🖼️","Images"],["anim","🎞️","Animations"]].filter(([k])=>sourcesDuType(k).some(t=>!t.perso)); }
const mascP=()=>MASC.replace('width="46" height="46"','width="34" height="34"');
function lateral(){ const p=S.p, th=S.th, n=S.etape;
  const it=(i,lab)=>{ const c=th.c[ETAPES_S[i].c]; const fait=etapeFaiteS(i+1)&&n!==i+1; return `<button class="lat-it ${n===i+1?"on":""} ${fait?"fait":""}" style="${varsCouleur(c,"sc")}" data-act="etape" data-n="${i+1}"><span class="pt">${fait?"✓":i+1}</span>${lab}</button>`; };
  let sub=""; if(n===2&&p.parties.length){ moteurSimple(); const ps=p.parties, x=ps.find(q=>q.id===S.partie)||ps[0], ch=S.sous!=="ecrire", ty=S.rech.type||"texte";
    sub=`<div class="lat-sub"><div class="lat-et">Mes questions</div>${ps.map(q=>{ const ok=nbMots(q.texte)>=objMots(q); return `<button class="lat-q ${q===x?"on":""} ${ok?"ok":""}" style="${varsCouleur(couleurPartie(q),"pc")}" data-act="allerQuestion" data-id="${q.id}" title="${esc(q.titre||libQuestion(q))}"><span class="pt">${ok&&q!==x?"✓":libNum(q)}</span><span class="t">${esc(court(q.titre||libQuestion(q),34))}</span></button>`; }).join("")}
     <div class="lat-et">Pour cette question</div>
     ${typesRech().map(([k,e,l])=>`<button class="lat-act ${ch&&ty===k?"on":""}" data-act="typeRech" data-v="${k}"><span class="e">${e}</span>${l}</button>`).join("")}
     <button class="lat-act ${!ch?"on":""}" data-act="sous" data-v="ecrire"><span class="e">✏️</span>J'écris</button></div>`; }
  let sub3=""; if(n===3&&M("quiz")){ const v=S.v3==="quiz"?"quiz":"diapos"; sub3=`<div class="lat-sub"><button class="lat-act ${v==="diapos"?"on":""}" data-act="vue3" data-v="diapos"><span class="e">🎞️</span>Mes diapos</button><button class="lat-act ${v==="quiz"?"on":""}" data-act="vue3" data-v="quiz"><span class="e">🧠</span>Mon quiz${quizOk(p).length?` <small>(${quizOk(p).length})</small>`:""}</button></div>`; }
  return `<aside class="lat"><button class="lat-logo" data-act="accueil" title="Retour à mes exposés">${mascP()}<span><b id="topTitre">${esc(p.titre||"Mon exposé")}</b><small>${esc(p.auteurs||"Atelier Exposés")}</small></span></button>
   <nav class="lat-nav">${it(0,"Mon sujet")}${it(1,"Mes réponses")}${sub}${it(2,"Je présente")}${sub3}</nav>
   <div class="lat-bas"><button class="lat-act" data-act="accueil"><span class="e">⌂</span>Mes exposés</button>${M("chrono")?`<button class="lat-act" data-act="chrono"><span class="e">⏱</span>Chronomètre</button>`:""}${S.settings.themeEleves?`<button class="lat-act" data-act="theme"><span class="e">🎨</span>Mes couleurs</button>`:""}<button class="lat-act discret" data-act="reglages"><span class="e">⚙</span>Réglages</button></div></aside>`; }

function renderAccueilSimple(){ const m=S.settings.modules; appliquerTheme(); const th=S.th; S.accCss=accVars(th.c[0]);
  const ex=S.index.slice().sort((a,b)=>b.maj-a.maj);
  $("#app").innerHTML=`<div class="projet simple" style="${S.accCss}">
   <aside class="lat"><div class="lat-logo static">${mascP()}<span><b>Atelier Exposés</b><small>Je cherche, je comprends, je présente</small></span></div>
    <nav class="lat-nav"><button class="lat-new" data-act="nouveau">＋ Nouvel exposé</button>
     <div class="lat-et">Mon espace</div>
     <button class="lat-act on" data-act="accueil"><span class="e">📚</span>Mes exposés</button>
     ${m.animations?`<button class="lat-act" data-act="choisirAnim"><span class="e">▶</span>Partir d'une animation</button>`:""}
     <button class="lat-act" data-act="importer"><span class="e">📂</span>Ouvrir un fichier</button>
     ${ex.length?`<button class="lat-act" data-act="gererExposes"><span class="e">🗑</span>${S.gerer?"J'ai fini":"Supprimer un exposé"}</button>`:""}</nav>
    <div class="lat-bas">${m.chrono?`<button class="lat-act" data-act="chrono"><span class="e">⏱</span>Chronomètre</button>`:""}<button class="lat-act discret" data-act="reglages"><span class="e">⚙</span>Réglages</button></div></aside>
   <div class="lat-main"><main class="etape" id="main"><div class="acc-main"><h1>Mes exposés</h1>
    ${ex.length?`<div class="s-exposes">${ex.map(x=>`<div class="s-ex ${x.matiere}" ${S.gerer?"":`data-act="ouvrir" data-id="${x.id}" role="button" tabindex="0"`}>
      <span class="badge ${x.matiere}">${esc(MATIERES[x.matiere]||"Exposé")}</span><b>${esc(x.titre||"Exposé sans titre")}</b><span class="muted">${esc(x.auteurs||"")}</span>
      <div class="prog"><i style="width:${Math.round((x.prog||0)*100)}%"></i></div>${S.gerer?`<button class="btn danger petit" data-act="supprimerExpose" data-id="${x.id}">Supprimer</button>`:""}</div>`).join("")}</div>`
     :`<div class="acc-vide"><p>Tu n'as pas encore d'exposé.</p><button class="btn plein grand" data-act="nouveau">＋ Je commence un exposé</button></div>`}
   </div></main></div></div>`;
  $("#app").style.cssText=S.accCss; }

function renderSimple(){ const p=S.p; if(S.etape>3) S.etape=3; if(S.etape<1) S.etape=1; appliquerTheme(); const th=S.th; S.accCss=accVars(th.c[ETAPES_S[S.etape-1].c]);
  if(S.etape===2){ if(!p.parties.find(x=>x.id===S.partie)) preparerS(2); rangerSimple(); }
  $("#app").innerHTML=`<div class="projet simple" style="${S.accCss}">${lateral()}
   <div class="lat-main">${(S._gh=htmlConsigne())}<main class="etape" id="main">${[vSSujet,vSReponses,vSPresente][S.etape-1]()}</main></div></div>`;
  $("#app").style.cssText=S.accCss;
  if(S.etape===2){ if(S.sous==="ecrire") apresEcrire(); else apresChercher(); }
  if(S.etape===3) apresDiapo();
  ajusterSlides(); }

function vSSujet(){ const p=S.p, st=S.settings;
  const resume=`<div class="s-choix">${p.matiere?`<button class="s-pastille" data-act="changerMatiere" title="Changer de matière">${ICO_MAT[p.matiere]} ${esc(MATIERES[p.matiere])} <i>✎</i></button>`:""}${p.sujet&&p.sujet.titre&&!S.listeSujets&&M("sujets")?`<button class="s-pastille" data-act="changerSujet" title="Changer de sujet">${esc(p.sujet.titre)} <i>✎</i></button>`:""}</div>`;
  if(!p.matiere) return `<div class="s-col"><h2 class="s-q">Dans quelle matière ?</h2><div class="matieres">${Object.entries(MATIERES).map(([k,v])=>`<button class="mat-btn ${k}" data-act="choixMatiere" data-v="${k}"><span class="mat-ico">${ICO_MAT[k]}</span>${esc(v)}</button>`).join("")}</div></div>`;
  if(M("sujets")&&p.matiere!=="autre"&&(!p.sujet||S.listeSujets)) return `<div class="s-col">${resume}<h2 class="s-q">Choisis ton sujet</h2><section class="carte">${vListeSujets()}</section></div>`;
  const pn=partiesNormales(p); const anim=p.animation&&M("animations")?animInfo(p.animation.id):null;
  const ex=["Exemple : Qui… ?","Exemple : Comment… ?","Exemple : Pourquoi… ?","Exemple : Où… ?","Exemple : Quand… ?","Exemple : À quoi sert… ?"];
  return `<div class="s-col">${resume}
   <section class="carte s-carte"><label class="s-champ"><span>Le titre de mon exposé</span><input data-in="champ" data-k="titre" value="${esc(p.titre)}" placeholder="Exemple : Les châteaux forts"></label>
    <label class="s-champ"><span>Mon prénom</span><input data-in="champ" data-k="auteurs" value="${esc(p.auteurs)}" placeholder="Exemple : Lina et Hugo"></label></section>
   ${anim?`<section class="carte s-anim"><div class="anim-vign ${anim.matiere}">▶</div><div style="flex:1"><b>Une animation pour comprendre</b><div>${esc(anim.titre)}</div></div><button class="btn plein" data-act="voirAnim" data-id="${esc(anim.id)}">▶ Regarder</button></section>`:""}
   <section class="carte s-carte"><h2 class="s-q petit">Mes questions</h2><p class="hint" style="margin:-6px 0 2px">${p.sujet&&p.sujet.questions&&p.sujet.questions.length?"Voici des questions sur ton sujet. Tu peux les changer.":"Écris ce que tu veux savoir sur ton sujet."}</p>
    ${pn.map((x,i)=>`<div class="s-qligne" style="${varsCouleur(couleurPartie(x),"pc")}"><span class="num">${i+1}</span><input data-in="partieTitre" data-id="${x.id}" value="${esc(x.titre)}" placeholder="${ex[i]||""}">${pn.length>st.partiesMin?`<button class="ib petit" data-act="supprP" data-id="${x.id}" title="Enlever cette question">✕</button>`:""}</div>`).join("")}
    ${pn.length<st.partiesMax?(()=>{ const sg=suggQuestions(p); return S.sugOuvert?`<div class="s-sug">${sg.map(q=>`<button class="chip sug" data-act="ajoutQ" data-v="${esc(q)}">＋ ${esc(q)}</button>`).join("")}<button class="chip sug" data-act="ajoutP">✏️ Une question à moi</button></div>`:`<div><button class="btn petit" data-act="ouvrirSug">＋ Une question en plus</button></div>`; })():""}</section></div>`; }

/* ---------- v5 : zone « Je cherche » (Textes, Images, Animations) ---------- */
const EXCL=" -nude -naked -sex -porn -erotic -gore -corpse";
const SITES_INFO={"lumni.fr":["Lumni","🎓","Cours et documents"],"1jour1actu.com":["1jour1actu","📰","L'actualité des enfants"],"jde.fr":["Journal des enfants","🗞️","Articles pour les 8-12 ans"],"cite-sciences.fr":["Cité des sciences","🔬","Sciences et techniques"],"bnf.fr":["BnF","🏛️","Livres, cartes, documents"],"culture.gouv.fr":["Culture","🎭","Patrimoine et arts"],"education.gouv.fr":["Éducation nationale","🏫","Le site de l'école"],"meteofrance.com":["Météo-France","⛅","Le temps qu'il fait"],"cnrs.fr":["CNRS","🧪","Recherche scientifique"],"kids.esa.int":["ESA Kids","🚀","L'espace"],"mnhn.fr":["Muséum","🦖","Nature et sciences"]};
const estIdee=t=>!(t.type==="animation"&&t.etape<0&&S.p&&S.p.animation&&t.animId===S.p.animation.id);
const fmtDur=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function sourcesDuType(t){ const r=[], R=M("recherche");
  if(t==="texte"){ if(R&&M("qwant")&&S.serveur) r.push({k:"qwant",ico:"🛡️",nom:"Sites sûrs",sous:"Choisis par ton enseignant"});
    if(R&&M("vikidia")) r.push({k:"vikidia",ico:"📖",nom:"Vikidia",sous:"L'encyclopédie des 8-13 ans"});
    if(R&&M("wikimini")) r.push({k:"wikimini",ico:"🐘",nom:"Wikimini",sous:"L'encyclopédie des 7-13 ans"});
    if(R&&M("wikipedia")) r.push({k:"wikipedia",ico:"🌍",nom:"Wikipédia",sous:"Pour les plus grands"});
    if(M("sourcesPerso")) r.push({k:"livre",ico:"📕",nom:"Mon livre",sous:"Je note une page de mon livre",perso:1}); }
  if(t==="image"&&R&&M("commons")) r.push({k:"commons",ico:"🖼️",nom:"Images libres",sous:"Avec le nom de l'auteur"});
  if(t==="anim"){ if(M("animations")) r.push({k:"classe",ico:"🎬",nom:"Animations de la classe",sous:"Celles vues en classe"});
    if(R&&M("animCourtes")&&(S.settings.videoMax||0)>0) r.push({k:"courtes",ico:"🎞️",nom:"Animations courtes",sous:"Moins d'une minute"}); }
  return r; }
function sitesTuiles(){ if(!M("recherche")||!M("qwant")||!S.serveur) return [];
  return listeDomaines(S.settings.sitesConseilles).filter(d=>!/^(vikidia|wikimini)\./.test(d)).slice(0,8).map(d=>{ const i=SITES_INFO[d]; return {k:"qwant",site:d,ico:i?i[1]:"🌐",nom:i?i[0]:d,sous:i?i[2]:"Site conseillé"}; }); }
function tuileHtml(t,col){ const on=t.site?(S.rech.site===t.site&&S.rech.moteur==="qwant"):(S.rech.moteur===t.k&&!S.rech.site);
  return `<button class="tuile ${t.site?"site":""} ${on?"on":""}" style="${varsCouleur(col,"tc")}" data-act="sourceRech" data-k="${esc(t.k)}"${t.site?` data-site="${esc(t.site)}"`:""}><span class="ico">${t.ico}</span><span class="tt"><b>${esc(t.nom)}</b><small>${esc(t.sous||"")}</small></span></button>`; }
function suggQuestions(p){ const util=new Set(partiesNormales(p).map(x=>norm(x.titre))); const base=((p.sujet&&p.sujet.questions)||[]).concat(["Comment ça marche ?","Où et quand ?","Qui est concerné ?","Pourquoi est-ce important ?"]);
  return [...new Set(base)].filter(q=>q&&!util.has(norm(q))).slice(0,4); }
function libNum(q){ return q.kind==="intro"?"I":q.kind==="conclusion"?"C":partiesNormales(S.p).indexOf(q)+1; }
function dejaAnim(id){ return S.p.trouvailles.some(t=>t.type==="animation"&&t.animId===id); }
function vAnimClasse(){ const p=S.p, r=S.rech; const mots=norm(r.q||"").split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let l=catalogueComplet().map(a=>{ const h=norm(a.titre+" "+(a.motsCles||[]).join(" ")); return {a,sc:mots.filter(w=>h.includes(w)).length}; })
    .filter(o=>o.sc>0||(p.matiere&&p.matiere!=="autre"&&o.a.matiere===p.matiere)).sort((u,v)=>v.sc-u.sc||u.a.titre.localeCompare(v.a.titre,"fr")).slice(0,18).map(o=>o.a);
  if(!l.length) l=catalogueComplet().slice(0,18);
  return `<div class="src-tete"><span style="font-size:34px">🎬</span><div class="t"><b>Les animations de la classe</b><small class="muted">Regarde-les, puis garde celle qui t'aide à comprendre.</small></div></div>
   <div class="defile"><div class="anim-grille">${l.map(a=>{ const d=dejaAnim(a.id); return `<div class="anim-res"><div class="anim-vign ${a.matiere}">▶</div><b>${esc(a.titre)}</b><div class="ligne" style="gap:8px"><button class="btn petit" data-act="voirAnim" data-id="${esc(a.id)}">▶ Regarder</button><button class="btn petit ${d?"vert":"plein"}" data-act="garderAnimClasse" data-id="${esc(a.id)}">${d?"✓ Gardée":"⭐ Je garde"}</button></div></div>`; }).join("")}</div></div>`; }
function vCourtes(){ const r=S.rech, mx=S.settings.videoMax||60; const lim=mx%60===0?(mx/60)+" min":mx+" s";
  const tete=`<div class="src-tete"><span style="font-size:34px">🎞️</span><div class="t"><b>Animations courtes</b><small class="muted">Moins de ${lim} · Wikimedia Commons, avec le nom de l'auteur.</small></div></div>`;
  if(r.charge) return tete+`<div class="defile"><div class="vide">Recherche en cours…</div></div>`;
  if(r.err) return tete+`<div class="defile"><div class="info">${esc(r.err)}</div></div>`;
  if(!r.animRes) return tete+`<div class="defile"><div class="vide">Écris un mot-clé, puis clique sur 🔍 Chercher.</div></div>`;
  return tete+`<div class="defile"><div class="anim-grille">${r.animRes.map((v,i)=>{ const d=S.p.trouvailles.some(t=>t.video===v.video);
    return `<div class="vcard">${r.courte===i?`<video src="${esc(v.video)}" poster="${esc(v.thumb)}" controls autoplay playsinline></video>`:`<button class="vposter" data-act="voirCourte" data-i="${i}" aria-label="Voir cette animation">${v.thumb?`<img src="${esc(v.thumb)}" alt="">`:""}<span class="play">▶</span><span class="dur">${fmtDur(v.duree)}</span></button>`}
     <small>${esc(v.titre)}<br>${esc(v.credit)}</small><button class="btn petit ${d?"vert":"plein"}" data-act="garderCourte" data-i="${i}">${d?"✓ Gardée":"⭐ Je garde"}</button></div>`; }).join("")||`<div class="vide">Aucune animation courte trouvée. Essaie un autre mot.</div>`}</div></div>`; }
async function chercherCourtes(q){ const r=S.rech, mx=S.settings.videoMax||60; r.q=q; r.charge=true; r.err=null; r.animRes=null; r.courte=-1; S.temp=null; S.src=null; majLecteur();
  try{ const u=`${API.commons.api}?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=40&gsrsearch=${encodeURIComponent(q+" filetype:video"+EXCL)}&prop=imageinfo&iiprop=url|extmetadata|mime|size|metadata&iiurlwidth=640`;
    const j=await (await fetch(u)).json(); const pages=Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0)); const txt=h=>(h||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
    r.animRes=pages.filter(pg=>pg.imageinfo).map(pg=>{ const ii=pg.imageinfo[0], md=ii.extmetadata||{};
      let dur=Math.round(ii.duration||0); if(!dur&&Array.isArray(ii.metadata)){ const m=ii.metadata.find(x=>x.name==="length"||x.name==="duration"); if(m) dur=Math.round(+m.value||0); }
      if(!dur||dur>mx) return null; const lic=txt(md.LicenseShortName&&md.LicenseShortName.value); if(/non-free|fair use/i.test(lic)) return null;
      return {titre:pg.title.replace(/^File:|\.\w+$/g,"").replace(/_/g," "),thumb:ii.thumburl||"",video:ii.url,duree:dur,page:ii.descriptionurl,credit:`${txt(md.Artist&&md.Artist.value).slice(0,60)||"auteur inconnu"} · ${lic||"licence libre"} · Wikimedia Commons`}; }).filter(Boolean).slice(0,18);
  }catch(e){ r.err="La recherche n'a pas fonctionné. Vérifie que l'ordinateur est connecté à internet."; }
  r.charge=false; majLecteur(); }

function alertesFin(){ const p=S.p, st=S.settings; const a=[];
  p.parties.forEach(x=>{ if(nbMots(x.texte)<objMots(x)) a.push({msg:`La partie « ${x.titre||"sans titre"} » est trop courte (${nbMots(x.texte)} / ${objMots(x)} mots).`,btn:{t:"Écrire",act:"allerPartie",d:{id:x.id}}}); });
  if(!p.diapos.length) a.push({msg:"Tu n'as pas encore de diapos.",btn:{t:"Mes diapos",act:"etape",d:{n:4}}});
  p.diapos.forEach((d,i)=>{ if(tropMots(d)) a.push({msg:`La diapo ${i+1} a trop de mots.`,btn:{t:"Raccourcir",act:"allerDiapo",d:{i}}}); });
  if(p.trouvailles.some(t=>!t.partie)) a.push({msg:"Certaines trouvailles ne sont pas rangées.",btn:{t:"Les ranger",act:"etape",d:{n:2}}});
  return a; }
function guide(){ const p=S.p, st=S.settings, n=S.etape, pn=partiesNormales(p);
  const G=(msg,btn,pret)=>({msg,btn:btn||null,pret:!!pret});
  if(n===1){
    if(!p.matiere) return G("Commence par choisir ta matière.");
    if(M("sujets")&&p.matiere!=="autre"&&(!p.sujet||S.listeSujets)) return G("Choisis un sujet dans la liste. Tu peux aussi cliquer sur « Un autre sujet ».");
    if(!p.titre.trim()) return G("Écris le titre de ton exposé.");
    if(!p.auteurs.trim()) return G("Écris ton prénom (et celui de ton binôme).");
    if(M("questions")&&!p.questions.some(q=>q.trim())) return G("Écris 2 ou 3 questions : ce que tu veux savoir.");
    if(pn.length<st.partiesMin||pn.some(x=>!x.titre.trim())){
      const qs=p.questions.map(q=>q.trim()).filter(Boolean);
      if(M("questions")&&qs.some(q=>!p.parties.some(x=>x.titre===q))&&pn.length<st.partiesMax) return G("Ton plan n'est pas complet. Je peux le préparer avec tes questions.",{t:"Créer mon plan",act:"questionsEnParties"});
      if(pn.length<st.partiesMin) return G(`Il faut au moins ${st.partiesMin} parties dans ton plan. Ajoute une partie.`,{t:"+ Une partie",act:"ajoutP"});
      return G("Donne un titre à chaque partie de ton plan."); }
    return G("Ton plan est prêt. Tu peux chercher des documents !",{t:"Je cherche →",act:"etape",d:{n:2}},true); }
  if(n===2){
    const nt=p.trouvailles.length;
    if(!pn.length) return G("Ton plan est vide : ajoute des parties pour pouvoir ranger tes trouvailles.",{t:"← Mon plan",act:"etape",d:{n:1}});
    if(nt<2) return G(sourceCourante()?"Surligne un passage utile, ou clique sur « Je garde » sous une image. Il est rangé dans la partie choisie à droite.":"Tape un mot-clé à gauche, puis clique sur un résultat pour le lire.");
    if(p.trouvailles.some(t=>!t.partie)) return G("Certaines trouvailles ne sont pas rangées : choisis leur partie à droite.");
    const sans=pn.filter(x=>!p.trouvailles.some(t=>t.partie===x.id));
    return G(sans.length?`Tu peux continuer. Il te manque encore des trouvailles pour « ${court(sans[0].titre)} ».`:"Tu as de quoi écrire dans chaque partie !",{t:"J'écris →",act:"etape",d:{n:3}},true); }
  if(n===3){
    const x=p.parties.find(q=>q.id===S.partie)||p.parties[0];
    if(!x) return G("Prépare d'abord ton plan.",{t:"← Mon plan",act:"etape",d:{n:1}});
    const o=objMots(x), nb=nbMots(x.texte), fini=q=>nbMots(q.texte)>=objMots(q)&&q.verifie;
    if(nb<o) return G(`Écris la partie « ${court(x.titre||"sans titre")} » avec tes mots : ${nb} / ${o} mots.`);
    if(!x.verifie) return G("Bravo, il y a assez de mots ! Fais relire ton texte par l'ordinateur.",{t:"✔ Vérifier mon texte",act:"verifier"});
    const suiv=p.parties.find(q=>q!==x&&!fini(q));
    if(suiv) return G("Cette partie est terminée ✓ Passe à la suivante.",{t:"Partie suivante →",act:"allerPartie",d:{id:suiv.id}});
    return G("Tous tes textes sont écrits et relus. Place aux diapos !",{t:"Mes diapos →",act:"etape",d:{n:4}},true); }
  if(n===4){
    if(!p.diapos.length) return G("Je prépare tes diapos.",{t:"Créer mes diapos",act:"genererDiapos"});
    const i=p.diapos.findIndex(d=>d.kind==="partie"&&d.partie&&!d.texte.trim());
    if(i>=0) return G(`Diapo ${i+1} : écris 2 ou 3 mots-clés, ou laisse-moi t'en proposer.`,i===S.diapo?{t:"💡 Proposer des mots-clés",act:"motsCles"}:{t:`Aller à la diapo ${i+1}`,act:"allerDiapo",d:{i}});
    const j=p.diapos.findIndex(tropMots);
    if(j>=0) return G(`La diapo ${j+1} a trop de mots : garde seulement l'essentiel.`,j===S.diapo?null:{t:`Aller à la diapo ${j+1}`,act:"allerDiapo",d:{i:j}});
    return G("Tes diapos sont prêtes. Regarde-les une dernière fois.",{t:"Je présente →",act:"etape",d:{n:5}},true); }
  const a=alertesFin();
  if(a.length) return G(a[0].msg,a[0].btn);
  return G("Ton exposé est prêt ! Entraîne-toi, puis présente-le.",{t:"▶ Présenter",act:"presenter"},true); }

   +(g&&g.btn?`<button class="btn plein grand ${g.pret?"pulse":""}" data-act="${g.btn.act}"${dataAttrs(g.btn.d)}>${esc(g.btn.t)}</button>`:"")

function cibleAuto(){ const p=S.p; const ok=p.parties.find(x=>x.id===S.cible&&x.kind==="partie"); if(ok) return ok.id; const f=partiesNormales(p)[0]; S.cible=f?f.id:null; return S.cible; }
function rangerOrphelins(){ const p=S.p; const ids=new Set(p.parties.map(x=>x.id)); if(!p.trouvailles.some(t=>!t.partie||!ids.has(t.partie))) return; const c=cibleAuto(); if(!c) return; p.trouvailles.forEach(t=>{ if(!t.partie||!ids.has(t.partie)) t.partie=c; }); sauver(); }
function etapeReprise(){ if(simple()){ for(let n=1;n<=2;n++) if(!etapeFaiteS(n)) return n; return 3; } for(let n=1;n<=4;n++) if(!etapeFaite(n)) return n; return 5; }
function preparer(n){ const p=S.p; if(!p) return; if(simple()){ preparerS(n); return; }
  if(n>=2) rangerOrphelins();
  if(n===2) S.cible=cibleAuto();
  if(n===3){ const cur=p.parties.find(x=>x.id===S.partie); if(!cur){ const inc=p.parties.find(x=>nbMots(x.texte)<objMots(x)); S.partie=(inc||p.parties[0]||{}).id; } }
  if(n===4) synchroDiapos(); }
function apresPreparer(n){ const p=S.p; if(simple()) moteurSimple(); if(n===2&&p&&!S.rech.q&&p.titre&&(!simple()||S.sous!=="ecrire")&&(simple()?moteursS().length:moteurs().length)&&(S.serveur||S.rech.moteur!=="qwant")){ S.rech.q=p.titre; renderProjet(); chercher(p.titre); } }
function planDepuisQuestions(p){ const qs=p.questions.map(q=>q.trim()).filter(Boolean); const vides=partiesNormales(p).filter(x=>!x.titre.trim()&&!x.texte.trim()); vides.forEach(v=>p.parties.splice(p.parties.indexOf(v),1));
  let n=0; qs.forEach(q=>{ if(partiesNormales(p).length>=S.settings.partiesMax) return; if(p.parties.some(x=>x.titre===q)) return; insererPartie(p,{id:uid(),kind:"partie",titre:q,texte:""}); n++; }); return n; }
function motsClesDe(t){ const liaisons=/^(d['’]abord|ensuite|enfin|puis|par exemple|en effet|c['’]est pourquoi|cependant|mais|donc|aussi|de plus|dans notre région|pour conclure|nous avons appris que|cela signifie que|au contraire)\s*,?\s*/i;
  return String(t).split(/(?<=[.!?])\s+/).map(x=>x.trim().replace(liaisons,"").replace(/[.!?…]+$/,"")).filter(x=>x.split(/\s+/).length>=2).slice(0,3)
   .map(x=>{ const m=x.split(/\s+/), max=Math.max(3,Math.min(6,Math.floor(S.settings.diapoMotsMax/3))); return m.length>max?m.slice(0,max).join(" ").replace(/[,;:]$/,""):x; }).map(x=>x.charAt(0).toUpperCase()+x.slice(1)); }
function premierMediaPartie(pid){ const ts=S.p.trouvailles.filter(t=>t.partie===pid); const x=ts.find(t=>t.type==="animation"||(t.type==="image"&&t.video))||ts.find(t=>t.type==="image")||ts.find(t=>t.type==="tableau"); return x?x.id:null; }
function diapoPartie(x){ const p=S.p, qs=M("questions")?p.questions.filter(q=>q.trim()):[]; const m=premierMediaPartie(x.id); const mt=m&&p.trouvailles.find(t=>t.id===m);
  return {id:uid(),kind:"partie",partie:x.id,titre:x.titre||"",texte:x.kind==="intro"?qs.join("\n"):"",media:m,layout:mt&&mt.type==="animation"?"media":"cote"}; }
function synchroDiapos(){ const p=S.p; if(!p.diapos.length){ genererDiapos(); return; }
  const ids=new Set(p.parties.map(x=>x.id)); p.diapos=p.diapos.filter(d=>!d.partie||ids.has(d.partie));
  p.parties.forEach((x,k)=>{ if(p.diapos.some(d=>d.partie===x.id)) return; let idx=-1; for(let j=k-1;j>=0&&idx<0;j--) idx=p.diapos.findIndex(d=>d.partie===p.parties[j].id);
    if(idx<0) idx=Math.max(0,p.diapos.findIndex(d=>d.kind==="titre")); p.diapos.splice(idx+1,0,diapoPartie(x)); });

  String(S.settings.sujetsPerso||"").split("\n").forEach(l=>{ const [m,t,q]=l.split("|").map(x=>(x||"").trim()); if(!t) return; const n=norm(m);
    const mk=n.startsWith("hist")?"histoire":n.startsWith("geo")?"geographie":n.startsWith("sci")?"sciences":"autre";
    out.push({matiere:mk,theme:"Sujets proposés par l'enseignant",niveau:"classe",titre:t,anim:"",questions:(q||"").split(";").map(x=>x.trim()).filter(Boolean),perso:true}); });

    ${M("animations")?`<button class="btn petit" data-act="ajoutAnimSource">+ Une animation</button>`:""}

function libPartie(x){ return x.kind==="intro"?"Introduction":x.kind==="conclusion"?"Conclusion":`${partiesNormales(S.p).indexOf(x)+1}. ${court(x.titre||"sans titre",30)}`; }

function vTrouvaillesRangees(){ const p=S.p; const grp=(x)=>{ const ts=p.trouvailles.filter(t=>t.partie===(x?x.id:null)); if(!x&&!ts.length) return "";
    const lib=!x?"":x.kind==="intro"?"I":x.kind==="conclusion"?"C":partiesNormales(p).indexOf(x)+1; const cible=x&&S.cible===x.id;
    return `<div class="grp ${cible?"cible-on":""}" ${x?`data-drop="${x.id}" style="${varsCouleur(couleurPartie(x),"pc")}"`:`data-drop="" style="--pc:#9AA1AE;--pcl:#F1F2F4;--pcd:#4B5260"`}>

function iconeSrc(s){ return {web:"📖",perso:s.genre==="site"?"🌐":s.genre==="photo"?"📷":"📕",animation:"🎬",image:"🖼"}[s.type]||"📄"; }

 partie:["D'abord,","Ensuite,","Par exemple,","Cela signifie que","C'est pourquoi","Au contraire,","En effet,","Dans notre région,"],
 conclusion:["Pour conclure,","Nous avons appris que","Ce qui nous a le plus étonnés, c'est"]};
function vEcrire(){ const p=S.p, st=S.settings; if(!S.partie||!p.parties.find(x=>x.id===S.partie)) S.partie=p.parties[0]?.id;
  const x=p.parties.find(q=>q.id===S.partie); if(!x) return `<div class="vide">Prépare d'abord ton plan (étape 1).</div>`;
  const obj=x.kind==="partie"?st.motsMin:15; const ts=p.trouvailles.filter(t=>t.partie===x.id);
  return `<div class="ecrire">
  <section class="panneau"><h3>Mes parties</h3><div class="defile part-nav">${p.parties.map(q=>{ const n=nbMots(q.texte), o=q.kind==="partie"?st.motsMin:15;
    return `<button class="${q.id===S.partie?"on":""}" style="${varsCouleur(couleurPartie(q),"pc")}" data-act="partie" data-id="${q.id}">${esc(q.titre||"Partie sans titre")}<div class="prog"><i style="width:${Math.min(100,n/o*100)}%"></i></div><small class="muted" style="font-weight:600">${n} mot(s)</small></button>`; }).join("")}</div></section>
  <section class="editeur" style="${varsCouleur(couleurPartie(x),"pc")}">
   <input class="titre-p" data-in="partieTitre" data-id="${x.id}" value="${esc(x.titre)}" ${x.kind!=="partie"?"readonly":""} placeholder="Titre de la partie">
   ${M("amorces")?`<div class="chips">${(AMORCES[x.kind]||AMORCES.partie).map(a=>`<button class="chip" data-act="amorce" data-v="${esc(a)}" style="font-size:15px">${esc(a)}</button>`).join("")}</div>`:""}
   <textarea id="txt" spellcheck="true" lang="fr" placeholder="${x.kind==="intro"?"Présente ton sujet et tes questions…":x.kind==="conclusion"?"Résume ce que tu as appris…":"Écris ici, avec tes propres mots…"}">${esc(x.texte)}</textarea>
   <div class="compteur"><b id="cpt">${nbMots(x.texte)} mot(s)</b><div class="prog"><i id="cptBar" style="width:${Math.min(100,nbMots(x.texte)/obj*100)}%"></i></div><span class="muted">objectif : ${obj} mots</span></div>
   <div class="ligne">${M("ecoute")?`<button class="btn" data-act="lireTexte">🔊 Écouter mon texte</button>`:""}
    <button class="btn plein" data-act="verifier">✔ Vérifier mon texte</button>
    ${st.lienCorrecteur?`<button class="btn" data-act="correcteurExterne">Ouvrir le Correcteur</button>`:""}</div>
   <div id="verif">${vVerif()}</div>
  </section>
  <section class="panneau"><h3>Pour m'aider</h3><div class="defile">
   <b style="font-size:16px">Mes trouvailles pour cette partie</b>
   <div style="margin-top:8px">${ts.map(t=>carteTr(t,{noX:1})).join("")||`<div class="vide" style="font-size:14px;padding:12px">Aucune trouvaille rangée ici. <button class="btn petit" data-act="etape" data-n="2" style="margin-top:6px">Retourner chercher</button></div>`}</div>
   ${M("lexique")?`<b style="font-size:16px;display:block;margin-top:16px">Mon lexique</b><p class="hint">Les mots difficiles et leur explication.</p>
    ${p.lexique.map(l=>`<div class="lex-ligne"><input data-in="lexMot" data-id="${l.id}" value="${esc(l.mot)}" placeholder="Mot"><textarea data-in="lexDef" data-id="${l.id}" rows="3" spellcheck="true" lang="fr" placeholder="Ce mot veut dire…">${esc(l.def)}</textarea>${l.defSource?`<small>D'après ${esc(l.defSource)} — tu peux la redire avec tes mots.</small>`:""}<div class="ligne" style="gap:6px">${M("dictionnaire")?`<button class="btn petit" data-act="dico" data-id="${l.id}">📖 Chercher la définition</button>`:""}<button class="btn petit discret" data-act="supprLex" data-id="${l.id}">Retirer</button></div></div>`).join("")}
    <button class="btn petit" data-act="ajoutLex">+ Un mot</button>`:""}
  </div></section></div>`; }
function vVerif(){ const v=S.verif; if(!v||v.partie!==S.partie) return ""; if(v.charge) return `<div class="verif-item">Vérification en cours…</div>`;
  if(!v.items.length) return `<div class="info ok">Je n'ai rien trouvé à corriger. Relis-toi quand même à voix haute !</div>`;
  return `<b style="font-size:16px">${v.items.length} remarque(s)</b>`+v.items.map((it,i)=>`<div class="verif-item ${it.cl}"><div>${it.msg}</div>${it.ctx?`<div style="margin-top:4px" class="muted">${it.ctx}</div>`:""}${it.sugg&&it.sugg.length?`<div class="sugg">${it.sugg.map((s,j)=>`<button class="btn petit" data-act="appliquer" data-i="${i}" data-j="${j}">${esc(s)}</button>`).join("")}</div>`:""}</div>`).join(""); }
function apresEcrire(){ const ta=$("#txt"); if(!ta) return;
  ta.addEventListener("input",()=>{ const x=S.p.parties.find(q=>q.id===S.partie); x.texte=ta.value; x.verifie=false; const n=nbMots(ta.value), o=x.kind==="partie"?S.settings.motsMin:15; $("#cpt").textContent=n+" mot(s)"; $("#cptBar").style.width=Math.min(100,n/o*100)+"%"; const nb=$(`.part-nav [data-id="${x.id}"]`); if(nb){ nb.querySelector("i").style.width=Math.min(100,n/o*100)+"%"; nb.querySelector("small").textContent=n+" mot(s)"; } sauver(); majGuide(); });
  const colle=e=>{ const cp=e.clipboardData?String(e.clipboardData.getData("text")||"").trim():""; if(cp&&S._defCopiee&&cp===S._defCopiee) return; const cc=S.settings.copierColler; if(cc==="interdire"){ e.preventDefault(); toast("Ici, on écrit avec ses propres mots : le copier-coller est désactivé.","warn"); } else if(cc==="avertir") toast("Tu as collé un texte : reformule-le avec tes mots, ou mets-le « entre guillemets » et cite la source.","warn"); };
  ta.addEventListener("paste",colle); ta.addEventListener("drop",colle); }
function verifLocale(t){ const items=[]; const ex=s=>esc(s.length>70?s.slice(0,70)+"…":s);
  const phrases=t.split(/(?<=[.!?])\s+/).filter(s=>s.trim());
  phrases.forEach(ph=>{ const s=ph.trim(); if(/^[a-zà-ÿ]/.test(s)) items.push({cl:"style",msg:"Une phrase commence par une <b>majuscule</b>.",ctx:"« "+ex(s)+" »"});
    if(nbMots(s)>35) items.push({cl:"style",msg:"Cette phrase est très longue. Peux-tu la <b>couper en deux</b> ?",ctx:"« "+ex(s)+" »"}); });
  const fin=t.trim(); if(fin&&!/[.!?…»)]$/.test(fin)) items.push({cl:"style",msg:"N'oublie pas le <b>point</b> à la fin de ta dernière phrase."});
  const rep=t.match(/\b(\p{L}+)\s+\1\b/giu); if(rep) rep.forEach(r=>items.push({cl:"ortho",msg:"Mot répété : <q>"+esc(r)+"</q>"}));
  if(/ {2,}/.test(t)) items.push({cl:"style",msg:"Il y a deux espaces à la suite.",sugg:["Corriger les espaces"],fix:"espaces"});
  return items; }
function verifCopie(t){ if(!S.settings.detectionCopie) return []; const N=7; const w=norm(t.replace(/«[^»]*»|"[^"]*"|“[^”]*”/g," ")).split(" "); if(w.length<N) return [];
  const sh=new Set(); const ajout=txt=>{ const v=norm(txt).split(" "); for(let i=0;i+N<=v.length;i++) sh.add(v.slice(i,i+N).join(" ")); };
  S.p.trouvailles.filter(x=>x.type==="texte").forEach(x=>ajout(x.contenu)); S.p.sources.forEach(s=>{ if(s.html){ const d=document.createElement("div"); d.innerHTML=s.html; ajout(d.textContent.slice(0,40000)); } else if(s.texte) ajout(s.texte); else if(s.etapes) s.etapes.forEach(e=>ajout(e.legende)); });
  const res=[]; let i=0; while(i+N<=w.length){ if(sh.has(w.slice(i,i+N).join(" "))){ let j=i+N; while(j<w.length&&sh.has(w.slice(j-N+1,j+1).join(" "))) j++; res.push(w.slice(i,j).join(" ")); i=j; } else i++; }
  return res.map(r=>({cl:"copie",msg:"Ce passage est <b>copié</b> d'une source. Écris-le avec tes mots, ou mets-le « entre guillemets » en citant la source.",ctx:"« "+esc(r)+" »"})); }
async function verifier(){ const x=S.p.parties.find(q=>q.id===S.partie); const t=x.texte||""; if(!t.trim()){ toast("Écris d'abord quelques phrases.","warn"); return; }
  S.verif={partie:x.id,charge:true,items:[]}; $("#verif").innerHTML=vVerif();
  let items=[...verifCopie(t),...(M("verifLocale")?verifLocale(t):[])];
  if(S.settings.correcteurLT){ try{ const r=await fetch(S.settings.ltUrl,{method:"POST",body:new URLSearchParams({text:t,language:"fr",level:"default"})}); const j=await r.json();
      const lt=(j.matches||[]).map(m=>{ const mot=t.substr(m.offset,m.length); const ctx=esc(t.slice(Math.max(0,m.offset-30),m.offset))+"<q>"+esc(mot)+"</q>"+esc(t.slice(m.offset+m.length,m.offset+m.length+30));
        return {cl:/typo|whitespace|style/i.test(m.rule?.issueType||"")?"style":"ortho",msg:esc(m.message),ctx:"…"+ctx+"…",sugg:(m.replacements||[]).slice(0,4).map(r=>r.value),off:m.offset,len:m.length,mot}; });
      items=[...lt,...items.filter(i=>i.cl!=="ortho")]; }
    catch(e){ toast("Le correcteur en ligne ne répond pas : j'utilise la relecture simple.","warn"); } }
  else if(!M("verifLocale")&&!items.length) toast("Pense aussi aux mots soulignés en rouge par l'ordinateur.");
  S.verif={partie:x.id,charge:false,items,texte:t}; $("#verif").innerHTML=vVerif(); x.verifie=true; sauver(); majGuide(); }
function appliquer(i,j){ const it=S.verif.items[i]; const x=S.p.parties.find(q=>q.id===S.partie); let t=x.texte;
  if(it.fix==="espaces") t=t.replace(/ {2,}/g," ");
  else if(it.off!=null){ if(t.substr(it.off,it.len)!==it.mot){ toast("Le texte a changé : relance la vérification.","warn"); return; } t=t.slice(0,it.off)+it.sugg[j]+t.slice(it.off+it.len); }
  x.texte=t; $("#txt").value=t; sauver(); toast("Corrigé !"); verifier(); }

/* ---------- étape 5 : diaporama ---------- */
function genererDiapos(){ const p=S.p; const d=[]; const tr=pid=>p.trouvailles.filter(t=>t.partie===pid);
  const premierMedia=ts=>{ const a=ts.find(t=>t.type==="animation"), i=ts.find(t=>t.type==="image"), tb=ts.find(t=>t.type==="tableau"); const x=a||i||tb; return x?x.id:null; };
  const img=p.trouvailles.find(t=>t.type==="image");
  d.push({id:uid(),kind:"titre",titre:p.titre||"Mon exposé",texte:"",media:img?img.id:null,layout:"cote"});
  const qs=M("questions")?p.questions.filter(q=>q.trim()):[]; const intro=p.parties.find(x=>x.kind==="intro");
  if(qs.length&&!intro) d.push({id:uid(),kind:"partie",sommaire:true,titre:"Nos questions",texte:qs.join("\n"),media:null,layout:"cote"});
  p.parties.forEach(x=>d.push(diapoPartie(x)));
  if(M("lexique")&&p.lexique.some(l=>l.mot&&l.def)) d.push({id:uid(),kind:"partie",lex:true,titre:"Les mots à retenir",texte:p.lexique.filter(l=>l.mot&&l.def).map(l=>l.mot+" : "+l.def).join("\n"),media:null,layout:"cote"});
  d.push({id:uid(),kind:"fin",titre:"Merci ! Avez-vous des questions ?",texte:"",media:null,layout:"cote"});
  p.diapos=d; S.diapo=0; sauver(); }
function slideHTML(d,mode){ const p=S.p; const mat=p.matiere||"autre"; const t=d.media?p.trouvailles.find(x=>x.id===d.media):null;
  const lignes=String(d.texte||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const texte=lignes.length?(lignes.length>1?`<ul>${lignes.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:`<div>${esc(lignes[0])}</div>`):(mode==="edit"&&d.kind==="partie"?`<div class="ph">Écris 2 ou 3 mots-clés…</div>`:"");
  const media=t?mediaHTML(t,mode):"";
  const sty=S.th&&S.th.diapos==="theme"?(c=>` style="--th:${c};--th2:${clair(c)}"`)(d.partie&&p.parties.find(x=>x.id===d.partie)?couleurPartie(p.parties.find(x=>x.id===d.partie)):S.th.c[0]):"";
  if(d.kind==="titre") return `<div class="slide k-titre ${mat}"${sty}><div class="bloc-titre"><div class="tt"><h1>${esc(d.titre)}</h1><div class="aut">${esc(p.auteurs||"")}</div><div class="cl">${esc([p.classe,S.settings.ecole].filter(Boolean).join(" · "))}</div>${texte?`<div class="cl">${esc(d.texte)}</div>`:""}</div>${media?`<div class="media">${media}</div>`:""}</div></div>`;
  if(d.kind==="fin"){ const srcs=p.sources.filter(s=>p.trouvailles.some(x=>x.source===s.id)||s.type!=="web");
    return `<div class="slide k-fin ${mat}"${sty}><div class="bandeau">${esc(d.titre)}</div><div class="corps" style="flex-direction:column;gap:20px"><div style="font-size:34px;font-weight:800;color:var(--th)">Nos sources</div><ul class="sources">${srcs.map(s=>`<li>${esc(s.titre)} — ${esc(refSource(s))}</li>`).join("")||"<li>—</li>"}</ul></div></div>`; }
  return `<div class="slide l-${d.layout||"cote"} ${mat}"${sty}><div class="bandeau">${esc(d.titre||"")}</div><div class="corps">${texte||d.layout==="media"?`<div class="texte">${texte}</div>`:""}${media?`<div class="media">${media}</div>`:""}</div></div>`; }
function mediaHTML(t,mode){ if(t.type==="image"&&t.video&&mode==="show") return `<video class="vid" src="${esc(t.video)}" poster="${esc(t.contenu)}" controls playsinline preload="metadata"></video>${t.credit?`<div class="cred">${esc(t.credit)}</div>`:""}`;
  if(t.type==="image") return `<img src="${esc(t.contenu)}" alt="">${t.video?`<span class="vbadge">▶ ${t.duree||""} s</span>`:""}${t.credit?`<div class="cred">${esc(t.credit)}</div>`:""}`;
  if(t.type==="tableau") return `<div class="tabw">${t.contenu}</div>`;
  if(t.type==="texte"){ const s=S.p.sources.find(x=>x.id===t.source); return `<blockquote>« ${esc(t.contenu)} »<cite>${esc(s?s.titre:"")}</cite></blockquote>`; }
  if(t.type==="animation"){ const a=animInfo(t.animId); if(mode==="show") return `<div class="anim-slot" data-anim="${esc(t.animId)}" data-e="${t.etape}" style="width:100%;height:100%"></div>`;
    const ea=etapesAnim(t.animId); return `<div class="anim-ph"><div class="rond">▶</div><div>${esc(a.titre)}</div><small>${t.etape>=0?"Étape "+(t.etape+1)+(ea[t.etape]?" : "+esc(ea[t.etape].titre):""):"Animation complète"}</small></div>`; }
  return ""; }
function sbox(d,mode){ return `<div class="sbox">${slideHTML(d,mode)}</div>`; }

    ${d.media&&p.trouvailles.find(t=>t.id===d.media)?.type==="animation"?`<button class="btn petit" data-act="voirAnimTr" data-id="${d.media}">▶ Tester l'animation</button>`:""}</div></section>

   <div id="motsDiapo" class="${mots>st.diapoMotsMax?"info":"muted"}" style="font-size:15px;margin:-6px 0 10px">${mots} mot(s) — maximum conseillé : ${st.diapoMotsMax}</div>
   ${d.kind==="partie"&&d.partie?`<div class="ligne" style="margin:-2px 0 12px"><button class="btn petit" data-act="motsCles">💡 Proposer des mots-clés</button></div>`:""}
   ${d.kind==="partie"?`<div class="chips" style="margin-bottom:12px"><button class="chip ${d.layout!=="media"?"on":""}" data-act="layout" data-v="cote">Texte + image</button><button class="chip ${d.layout==="media"?"on":""}" data-act="layout" data-v="media">Grande image</button></div>`:""}
   <label class="champ"><span>🗣 Ce que je dis (éléments de langage)</span><textarea id="notes" data-in="diapoNotes" rows="3" spellcheck="true" lang="fr" placeholder="Les phrases que je vais dire en montrant cette diapo…">${esc(d.notes||"")}</textarea></label>
   <b style="font-size:16px">Image, tableau ou animation</b>
   <div class="media-choix" style="margin-top:8px"><button class="${d.media?"":"on"}" data-act="choixMedia" data-id="">Aucun</button>${tri.map(t=>`<button class="${d.media===t.id?"on":""}" data-act="choixMedia" data-id="${t.id}" title="${esc(t.legende||t.contenu||"").slice(0,120)}">${t.type==="image"?`<img src="${esc(t.contenu)}" alt="">`:t.type==="animation"?`<span>▶ ${esc(animInfo(t.animId).titre).slice(0,40)}${t.etape>=0?"<br>étape "+(t.etape+1):""}</span>`:t.type==="tableau"?"Tableau":"« "+esc(t.contenu.slice(0,50))+"… »"}<span class="ty">${{image:"image",tableau:"tableau",animation:"anim",texte:"citation"}[t.type]}</span></button>`).join("")}</div>`:`<p class="hint">La liste de tes sources s'affiche automatiquement.</p>`}
   <div class="ligne" style="margin-top:16px"><button class="ib petit" data-act="bougerDiapo" data-v="-1" title="Avancer">↑</button><button class="ib petit" data-act="bougerDiapo" data-v="1" title="Reculer">↓</button><button class="btn petit danger" data-act="supprDiapo">Supprimer la diapo</button></div>
  </div></section></div>`; }

function presenter(i){ if(!S.p.diapos.length){ toast("Prépare d'abord tes diapos.","warn"); return; } S.p.presente=true; sauver(); PK=i||0; const pr=$("#presenter"); pr.classList.remove("hidden");
  pr.innerHTML=`<div class="sbox" id="pbox"></div><div class="zone g" data-act="pPrec"></div><div class="zone d" data-act="pSuiv"></div><div class="pnav">${M("chrono")?`<button data-act="chrono" title="Chronomètre (C)">⏱</button>`:""}${M("quiz")&&quizOk(S.p).length?`<button data-act="quizOuvrir" title="Quiz">🧠</button>`:""}<button data-act="pPrec" title="Précédente">◀</button><span class="cpt" id="pcpt"></span><button data-act="pSuiv" title="Suivante">▶</button><button data-act="pQuitter" title="Quitter (Échap)">✕</button></div>`;
  const el=document.documentElement; if(el.requestFullscreen&&!document.fullscreenElement) el.requestFullscreen().catch(()=>{}); afficherP(); }
async function afficherP(){ const d=S.p.diapos[PK]; const b=$("#pbox"); if(!b) return; b.innerHTML=slideHTML(d,"show"); $("#pcpt").textContent=(PK+1)+" / "+S.p.diapos.length;

  const slot=$(".anim-slot",b); if(slot){ const f=await cadreAnim(slot.dataset.anim,+slot.dataset.e,false); if(S.p.diapos[PK]===d) slot.appendChild(f); } }
function quitterP(){ $("#presenter").classList.add("hidden"); $("#presenter").innerHTML=""; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
addEventListener("resize",()=>{ if(!$("#presenter").classList.contains("hidden")) { const b=$("#pbox"); if(b&&b.firstElementChild){ const w=Math.min(innerWidth,innerHeight*16/9); b.style.width=w+"px"; b.firstElementChild.style.transform=`scale(${w/1600})`; } } });

  if(["ArrowRight","PageDown"," "].includes(e.key)){ e.preventDefault(); act.pSuiv(); } else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); act.pPrec(); } else if(e.key==="Escape") quitterP(); });

  if(!t||!["image","tableau"].includes(t.type)) t=p.trouvailles.find(tt=>tt.partie===x.id&&tt.type==="image")||p.trouvailles.find(tt=>tt.partie===x.id&&tt.type==="tableau");
  return t; }
function numeroSource(id){ return S.p.sources.findIndex(s=>s.id===id)+1; }

     return `<div class="partie"><h2>${esc(x.titre||"")}</h2>${f?`<figure>${f.type==="image"?`<img src="${esc(f.contenu)}">`:`<div class="tabw">${f.contenu}</div>`}<figcaption>${esc(f.legende||"")}${f.credit?" — "+esc(f.credit):""}${s?` [${numeroSource(s.id)}]`:""}</figcaption></figure>`:""}

function imprimerOral(){ const p=S.p; const fiches=p.diapos.map((d,i)=>{ const x=d.partie?p.parties.find(q=>q.id===d.partie):null;

/* --- export / import --- */
function telecharger(nom,contenu,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([contenu],{type:type||"application/json"})); a.download=nom; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
const nomFichier=s=>String(s||"expose").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w-]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"expose";
function exporter(){ const p=S.p; telecharger(`${nomFichier(p.titre)}-${nomFichier(p.auteurs)}.expose.json`,JSON.stringify({app:"atelier-exposes",v:VERSION,projet:p})); toast("Fichier enregistré dans « Téléchargements »."); }
function choisirFichier(accept,multiple,dir){ return new Promise(res=>{ const old=$("#fichier"); const f=old.cloneNode(); old.replaceWith(f); f.accept=accept||""; f.multiple=!!multiple; if(dir) f.setAttribute("webkitdirectory",""); else f.removeAttribute("webkitdirectory"); f.onchange=()=>res([...f.files]); f.click(); }); }
async function importer(){ const [f]=await choisirFichier(".json,application/json"); if(!f) return;
  try{ const j=JSON.parse(await f.text()); const lst=j.projets||(j.projet?[j.projet]:[]); if(!lst.length) throw 0;
    for(const p0 of lst){ const p=migrer(p0); if(S.index.some(x=>x.id===p.id)){ p.id=uid(); p.titre=(p.titre||"")+" (copie)"; } await DB.set("p:"+p.id,p); S.index.unshift(resume(p)); }
    await DB.set("index",S.index); toast(lst.length>1?lst.length+" exposés importés.":"Exposé importé !"); if(lst.length===1) ouvrir(S.index[0].id); else render(); }
  catch(e){ toast("Ce fichier n'est pas un exposé de l'Atelier.","warn"); } }

async function choixAnim(id){ const mode=S._cataMode; let info=await chargerAnimEtapes(id); if(!info) info={...animInfo(id),etapes:[]};

function modalEtapes(info){ const st=S.settings; const et=info.etapes||[]; S._choixEt=et.map((e,k)=>k<st.partiesMax);
  const corps=et.length?`<p class="hint">Chaque étape cochée devient une <b>partie</b> de ton exposé (maximum ${st.partiesMax}). Choisis les plus importantes.</p>

   :`<div class="info">Les étapes de cette animation ne sont pas encore chargées sur cet ordinateur.</div><p>Tu peux quand même commencer : ton exposé partira de cette animation, et tu construiras ton plan toi-même. Pour récupérer les étapes, choisis le fichier de l'animation, ou demande à l'enseignant de charger le dossier des animations (Réglages).</p>
     <button class="btn" data-act="importerFichierAnim" data-id="${esc(info.id)}">Choisir le fichier de l'animation…</button>`;
  modal(`<div class="mtete"><span class="badge ${info.matiere}">${esc(MATIERES[info.matiere]||"")}</span><h2>${esc(info.titre)}</h2><button class="ib" data-act="fermer">✕</button></div>
   <div class="mcorps">${corps}</div><div class="mpied"><button class="btn" data-act="voirAnim" data-id="${esc(info.id)}">▶ Regarder d'abord</button><button class="btn plein" data-act="creerDepuisAnim" data-id="${esc(info.id)}">Commencer mon exposé</button></div>`,"large"); }
async function creerDepuisAnim(id){ const info=S.animIndex[id]||{...animInfo(id),etapes:[]}; const et=info.etapes||[]; const st=S.settings;
  const p=nouveauProjet(); p.origine="animation"; p.titre=info.titre; p.matiere=info.matiere||"autre"; p.animation={id}; p.motsCles=info.motsCles||[];
  const src={id:uid(),type:"animation",animId:id,titre:info.titre,resume:info.resume||"",etapes:et}; p.sources.push(src);
  const choix=et.map((e,k)=>k).filter(k=>S._choixEt&&S._choixEt[k]);
  if(choix.length){ p.parties=p.parties.filter(x=>x.kind!=="partie"); choix.forEach(k=>{ const x={id:uid(),kind:"partie",titre:et[k].titre,texte:""}; insererPartie(p,x);
      p.trouvailles.push({id:uid(),type:"texte",contenu:et[k].legende,couleur:1,source:src.id,partie:x.id,date:Date.now()});
      p.trouvailles.push({id:uid(),type:"animation",animId:id,etape:k,source:src.id,partie:x.id,date:Date.now()}); }); }
  else p.trouvailles.push({id:uid(),type:"animation",animId:id,etape:-1,source:src.id,partie:null,date:Date.now()});
  const sj=sujetsListe().find(x=>x.anim===id); if(sj){ p.sujet={titre:sj.titre,theme:sj.theme,niveau:sj.niveau,anim:sj.anim,questions:sj.questions}; p.matiere=sj.matiere; }
  p.questions=sj&&M("questionsDefaut")&&sj.questions.length?[...sj.questions]:["",""]; if(!choix.length&&p.questions.some(q=>q.trim())) planDepuisQuestions(p); fermer(); S.p=p; S.etape=1; S.src=null; S.temp=null; sauver(); render();
  toast(choix.length?"Ton plan est prêt : une partie par étape choisie.":"Exposé créé à partir de l'animation."); }
function ajouterSourceAnim(info){ const p=S.p; if(p.sources.some(s=>s.type==="animation"&&s.animId===info.id)){ S.src=p.sources.find(s=>s.type==="animation"&&s.animId===info.id).id; S.temp=null; renderProjet(); return; }
  const s={id:uid(),type:"animation",animId:info.id,titre:info.titre,resume:info.resume||"",etapes:info.etapes||[]}; p.sources.push(s); S.src=s.id; S.temp=null; sauver(); renderProjet(); }
async function importerFichierAnim(idAttendu){ const fs=await choisirFichier(".html,.htm,text/html"); if(!fs.length) return;
