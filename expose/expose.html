/* ================= v7 : chronomètre, quiz, définition par sélection ================= */
const CH={phase:"expose",el:{expose:0,questions:0,quiz:0},run:false,t0:0,ouvert:false,min:false,iv:null,fait:{}};
const PHASES=[["expose","🎤","Exposé"],["questions","❓","Questions"],["quiz","🧠","Quiz"]];
function chCfg(){ if(!S.settings.chrono) S.settings.chrono={expose:10,questions:5,quiz:5,mode:"rebours",son:true}; return S.settings.chrono; }
const chDur=ph=>Math.max(1,+chCfg()[ph]||5)*60000;
const chMs=()=>CH.el[CH.phase]+(CH.run?Date.now()-CH.t0:0);
const chMmSs=ms=>{ const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function chAffiche(){ const mode=chCfg().mode, ms=chMs(), d=chDur(CH.phase); let txt,etat="ok",sub;
  if(mode==="rebours"){ const reste=d-ms; if(reste>=0){ txt=chMmSs(Math.ceil(reste/1000)*1000); if(reste<=60000) etat="proche"; sub="sur "+chMmSs(d); } else { txt="+"+chMmSs(-reste); etat="depasse"; sub="temps dépassé"; } }
  else { txt=chMmSs(ms); if(ms>d) etat="depasse"; else if(d-ms<=60000) etat="proche"; sub=ms>d?"objectif dépassé ("+chMmSs(d)+")":"objectif "+chMmSs(d); }
  return {txt,etat,sub}; }
function bip(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=.18; o.start(); setTimeout(()=>{ o.stop(); a.close(); },700); }catch(e){} }
function chTick(){ const a=chAffiche(), box=$("#chrono"); if(box) box.dataset.etat=a.etat; const t=$("#chTemps"); if(t){ t.textContent=a.txt; $("#chSub").textContent=a.sub; } const pl=$("#chPill"); if(pl) pl.textContent=a.txt;
  if(CH.run&&chMs()>=chDur(CH.phase)&&!CH.fait[CH.phase]){ CH.fait[CH.phase]=true; if(chCfg().son) bip(); } }
function chRender(){ const c=$("#chrono"); if(!CH.ouvert){ c.className="hidden"; c.innerHTML=""; return; }
  c.style.cssText=S.accCss||""; const cfg=chCfg(), a=chAffiche(); c.dataset.etat=a.etat;
  if(CH.min){ c.className="min"; c.innerHTML=`<button class="ch-pill" data-act="chMin" title="Agrandir le chronomètre">${PHASES.find(x=>x[0]===CH.phase)[1]} <b id="chPill">${a.txt}</b></button>`; return; }
  c.className="";
  c.innerHTML=`<div class="ch-tete">${PHASES.map(([k,e,l])=>`<button class="${CH.phase===k?"on":""}" data-act="chPhase" data-v="${k}">${e} ${l}<small>${cfg[k]} min</small></button>`).join("")}<button class="ib petit" data-act="chMin" title="Réduire">–</button><button class="ib petit" data-act="chFerme" title="Fermer">✕</button></div>
   <div class="ch-temps" id="chTemps">${a.txt}</div><div class="ch-sub" id="chSub">${a.sub}</div>
   <div class="ch-btns"><button class="btn plein grand" data-act="chStart">${CH.run?"⏸ Pause":"▶ "+(chMs()>0?"Reprendre":"Démarrer")}</button><button class="btn" data-act="chReset" title="Remettre à zéro">↺ Zéro</button></div>
   <div class="ch-opts"><button class="btn petit ${cfg.mode==="rebours"?"sel":""}" data-act="chMode" data-v="rebours">⬇ À rebours</button><button class="btn petit ${cfg.mode!=="rebours"?"sel":""}" data-act="chMode" data-v="avance">⬆ Qui avance</button></div>
   <div class="ch-d"><span>Durée de cette phase</span><button class="ib petit" data-act="chDuree" data-d="-1">−</button><b>${cfg[CH.phase]} min</b><button class="ib petit" data-act="chDuree" data-d="1">+</button></div>
   ${CH.phase==="quiz"&&M("quiz")?`<button class="btn vert" data-act="quizOuvrir">🧠 Afficher le quiz</button>`:""}
   ${CH.phase!=="quiz"?`<button class="btn petit discret" data-act="chSuite">${CH.phase==="expose"?"Passer aux questions ▶":"Passer au quiz ▶"}</button>`:""}`; }
function chPause(){ if(CH.run){ CH.el[CH.phase]+=Date.now()-CH.t0; CH.run=false; clearInterval(CH.iv); } }
function chToggle(){ if(CH.run) chPause(); else { CH.run=true; CH.t0=Date.now(); clearInterval(CH.iv); CH.iv=setInterval(chTick,250); } if(!CH.ouvert) CH.ouvert=true; chRender(); }

const hexRgb=h=>{ h=String(h||"#000").replace("#",""); if(h.length===3) h=h.split("").map(x=>x+x).join(""); const n=parseInt(h,16)||0; return [n>>16&255,n>>8&255,n&255]; };
const rgbHex=a=>"#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const melange=(h,w,t)=>{ const a=hexRgb(h), b=hexRgb(w); return rgbHex(a.map((v,i)=>v+(b[i]-v)*t)); };
const clair=h=>melange(h,"#ffffff",.85), fonce=h=>melange(h,"#000000",.38);
function luminance(h){ const c=hexRgb(h).map(v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }

/* --- serveur local (lancer-atelier.bat) : résultats Qwant et pages lues dans l'Atelier --- */
async function detecterServeur(){ S.serveur=false; S.staan=false; S.quota=null; if(!/^https?:$/.test(location.protocol)) return; try{ const r=await fetch("api/ping",{cache:"no-store"}); if(r.ok){ const j=await r.json(); S.serveur=!!j.atelier; S.staan=!!j.staan; S.quota=j.quota||null; } }catch(e){} }
function domaine(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function listeDomaines(t){ return String(t||"").split(/[\s,;]+/).map(x=>x.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"")).filter(Boolean); }
const correspond=(d,l)=>l.some(x=>d===x||d.endsWith("."+x));
async function chercherQwant(q){ const r=S.rech; r.q=q; S.temp=null; S.src=null; r.qres=null; r.qerr=null;
  if(!S.serveur){ ouvrirQwant(q); majLecteur(); return; }
  r.charge=true; majLecteur();
  try{ const st=S.settings, conseilles=listeDomaines(st.sitesConseilles), bloques=listeDomaines(st.sitesBloques);
    const url="api/qwant?q="+encodeURIComponent(q)+"&inc="+encodeURIComponent(r.site?r.site:(S.staan&&!st.qwantOuvert?conseilles.slice(0,10).join(" "):""))+"&exc="+encodeURIComponent(bloques.slice(0,10).join(" "));
    const j=await (await fetch(url)).json(); if(j.quota) S.quota=j.quota; r.moteur2=j.moteur||"";
    if(!j.ok) r.qerr=j.err||"refus";
    else { const ok=listeDomaines(S.settings.sitesConseilles), ko=listeDomaines(S.settings.sitesBloques);
      let it=(j.items||[]).map(x=>({...x,domaine:domaine(x.url)})).filter(x=>x.domaine&&!correspond(x.domaine,ko)).map(x=>({...x,conseille:correspond(x.domaine,ok)}));
      if(r.site) it=it.filter(x=>correspond(x.domaine,[r.site]));
      else if(S.settings.qwantConseillesSeulement||(j.moteur==="staan"&&!S.settings.qwantOuvert)) it=it.filter(x=>x.conseille);
      it.sort((a,b)=>(b.conseille?1:0)-(a.conseille?1:0)); r.qres=it; } }
  catch(e){ r.qerr="reseau"; }
  r.charge=false; majLecteur(); }
function extrairePrincipal(doc){
  $$("script,style,noscript,nav,header,footer,aside,form,iframe,svg,button,select,[role=navigation],[role=banner],[role=contentinfo],[aria-hidden=true],.menu,.nav,.navbar,.sidebar,.breadcrumb,.share,.social,.comments,.cookie,.cookies,#cookie,.footer,.header,.pub,.advert,.ads",doc).forEach(e=>e.remove());
  const base=doc.querySelector("article")||doc.querySelector("main")||doc.querySelector("[role=main]")||doc.body; let meilleur=null, sc=0;
  $$("article,main,section,div",doc).forEach(el=>{ let n=0; for(const c of el.children) if(c.tagName==="P") n+=c.textContent.trim().length; if(n>sc){ sc=n; meilleur=el; } });
  let choix=meilleur&&sc>300?meilleur:base; if(base!==doc.body&&base.contains(choix)) choix=base;
  const h1=doc.querySelector("h1"); return (h1&&!choix.contains(h1)?`<h2>${esc(h1.textContent.trim())}</h2>`:"")+(choix?choix.innerHTML:""); }
async function ouvrirPageWeb(i){ const it=S.rech.qres&&S.rech.qres[i]; if(!it) return; S.rech.charge=true; majLecteur();
  try{ const r=await fetch("api/get?url="+encodeURIComponent(it.url)); if(!r.ok) throw 0; const html=await r.text(); const fin=r.headers.get("x-url-finale")||it.url;
    const doc=new DOMParser().parseFromString(html,"text/html"); const propre=nettoyer(extrairePrincipal(doc),(()=>{ try{ return new URL(fin).origin; }catch(e){ return ""; } })(),fin);
    const tmp=document.createElement("div"); tmp.innerHTML=propre; if(tmp.textContent.trim().length<80) throw 0;
    S.temp={id:uid(),type:"web",titre:it.title||doc.title||it.domaine,site:it.domaine,url:fin,date:Date.now(),html:propre,moteur:"Qwant Junior"}; }
  catch(e){ S.rech.charge=false; majLecteur(); toast("Cette page ne peut pas s'afficher ici : elle s'ouvre à côté. Copie le passage utile et colle-le en bas.","warn"); try{ window.open(it.url,"qwantjunior"); }catch(_){}; return; }
  S.rech.charge=false; majLecteur(); }

const DICOS=[
 {k:"dicoado",nom:"Le Dico des Ados",info:"dictionnaire écrit pour les 8-13 ans",apis:["https://fr.dicoado.org/w/api.php","https://fr.dicoado.org/dico/api.php"],page:t=>"https://fr.dicoado.org/dico/"+encodeURIComponent(String(t).replace(/ /g,"_")),titres:m=>[m.toLowerCase(),m,capitale(m)],mode:"liste"},
 {k:"vikidia",nom:"Vikidia",info:"encyclopédie des 8-13 ans",apis:["https://fr.vikidia.org/w/api.php"],page:t=>"https://fr.vikidia.org/wiki/"+encodeURIComponent(String(t).replace(/ /g,"_")),titres:m=>[capitale(m)],mode:"phrase"},
 {k:"wiktionnaire",nom:"Wiktionnaire",info:"dictionnaire pour tous, parfois plus difficile",apis:["https://fr.wiktionary.org/w/api.php"],page:t=>"https://fr.wiktionary.org/wiki/"+encodeURIComponent(String(t).replace(/ /g,"_")),titres:m=>[m.toLowerCase(),m],mode:"wikt"},
];
async function lireJSON(url){ try{ const r=await fetch(url); if(r.ok) return await r.json(); }catch(e){} if(S.serveur){ try{ const r=await fetch("api/get?url="+encodeURIComponent(url)); if(r.ok) return JSON.parse(await r.text()); }catch(e){} } return null; }
async function pageWiki(api,titre){ const j=await lireJSON(`${api}?action=parse&format=json&origin=*&redirects=1&prop=text&disableeditsection=1&page=${encodeURIComponent(titre)}`); if(!j) return null; return j.parse||{absent:true}; }
const texteNet=el=>{ const c=el.cloneNode(true); $$("ul,ol,dl,sup,.reference,.mw-editsection,style,script,.cachelien",c).forEach(x=>x.remove()); return c.textContent.replace(/\s+/g," ").trim(); };
const RUBRIQUES=/^(Étymologie|Prononciation|Voir aussi|Traductions|Anagrammes|Références|Synonymes|Antonymes|Dérivés|Apparentés|Vocabulaire|Hyperonymes|Hyponymes|Holonymes|Méronymes|Paronymes|Homophones|Notes?|Variantes|Abréviations|Expressions|Proverbes|Quasi-synonymes|Gentilés|Composés|Phrases|Attestations|Forme|Faux-amis|Augmentatifs|Diminutifs|Troponymes|Hypéronymes|Dérivés dans d)/i;
function extraireDefs(html,mode){ const d=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html").body;
  if(mode==="phrase"){ const p=$$("p",d).map(texteNet).find(t=>t.length>40&&!/peut d[ée]signer|homonymie/i.test(t)); if(!p) return []; const m=p.match(/^.{25,}?[.!?](\s|$)/); return [{nature:"",texte:(m?m[0]:p).trim().slice(0,320)}]; }
  const res=[]; let fr=mode!=="wikt", nature="";
  for(const el of $$("h2,h3,h4,ol",d)){ const t=el.textContent.replace(/\s+/g," ").trim();
    if(el.tagName==="H2"){ if(mode==="wikt"){ if(fr) break; fr=/^Français/i.test(t); } continue; }
    if(!fr) continue;
    if(el.tagName!=="OL"){ nature=RUBRIQUES.test(t)?null:t.replace(/\s*\d+$/,""); continue; }
    if(nature===null||el.parentElement.closest("li")) continue;
    for(const li of el.children){ if(li.tagName!=="LI") continue; const tx=texteNet(li); if(tx.length>3) res.push({nature:nature||"",texte:tx.slice(0,320)}); if(res.length>=4) break; }
    if(res.length>=4) break; }
  if(!res.length&&mode==="liste"){ const p=$$("p",d).map(texteNet).find(t=>t.length>20); if(p) res.push({nature:"",texte:p.slice(0,320)}); }
  return res; }
const singulier=m=>/aux$/i.test(m)?m.slice(0,-3)+"al":/[^s]s$/i.test(m)?m.slice(0,-1):/[aeiou]x$/i.test(m)?m.slice(0,-1):m;
async function definitions(mot){ const out=[];
  for(const dc of DICOS){ if(!S.settings.dicos[dc.k]) continue; let trouve=null; const titres=[...new Set([...dc.titres(mot),...dc.titres(singulier(mot))])];
    for(const api of dc.apis){ let joignable=false;
      for(const t of titres){ const pg=await pageWiki(api,t); if(!pg) break; joignable=true; if(pg.absent) continue; let defs=extraireDefs(pg.text["*"],dc.mode), titre=pg.title;
        if(defs.length&&/^(Pluriel|Féminin|Masculin|Première|Deuxième|Troisième|Participe|Ancienne orthographe)/.test(defs[0].texte)){ const m=defs[0].texte.match(/\b(?:de|du|d['’])\s*([\p{L}'’-]+)\s*\.?$/u);
          if(m){ const pg2=await pageWiki(api,m[1]); if(pg2&&!pg2.absent){ const d2=extraireDefs(pg2.text["*"],dc.mode); if(d2.length){ defs=d2; titre=pg2.title; } } } }
        if(defs.length){ trouve={dico:dc,titre,defs}; break; } }
      if(trouve||joignable) break; }
    out.push(trouve||{dico:dc,titre:mot,defs:[]}); }
  return out; }
async function modalDico(id){ const l=S.p.lexique.find(x=>x.id===id); const mot=(l&&l.mot||"").trim(); if(!mot){ toast("Écris d'abord le mot.","warn"); return; }
  S._dicoMot=id; const tete=`<div class="mtete"><h2>📖 « ${esc(mot)} »</h2><button class="ib" data-act="fermer">✕</button></div>`;
  modal(tete+`<div class="mcorps"><div class="vide">Je cherche dans les dictionnaires…</div></div>`,"large");
  const res=await definitions(mot); if(S._dicoMot!==id||$("#modal").classList.contains("hidden")) return; S._dicoRes=res;
  const corps=res.map((r,i)=>`<div class="reg-sec"><h3>${esc(r.dico.nom)} <small class="muted" style="font-weight:600">— ${esc(r.dico.info)}</small></h3>${r.defs.length?r.defs.map((d,j)=>`<div class="def-item"><p>${d.nature?`<small>${esc(d.nature)}</small><br>`:""}${esc(d.texte)}</p>${M("ecoute")?`<button class="ib petit" data-act="lireDef" data-i="${i}" data-j="${j}" title="Écouter">🔊</button>`:""}<button class="btn petit plein" data-act="choisirDef" data-i="${i}" data-j="${j}">Je choisis</button></div>`).join("")+`<a class="hint" href="${esc(r.dico.page(r.titre))}" target="_blank" rel="noopener">Voir la page du dictionnaire</a>`:`<p class="muted">Pas de définition trouvée ici.</p>`}</div>`).join("");
  modal(tete+`<div class="mcorps"><p class="info bleu">Lis les définitions et choisis le sens qui correspond à ton exposé. Ensuite, redis-la avec tes mots.</p>${corps}</div><div class="mpied"><button class="btn discret" data-act="fermer">Fermer</button></div>`,"large"); }

 async garderAnimClasse(d){ const p=S.p; if(dejaAnim(d.id)){ toast("Déjà gardée."); return; } let info=null; try{ info=await chargerAnimEtapes(d.id); }catch(e){} if(!info) info={...animInfo(d.id),etapes:[]};
   let s=p.sources.find(x=>x.type==="animation"&&x.animId===d.id); if(!s){ s={id:uid(),type:"animation",animId:d.id,titre:info.titre,resume:info.resume||"",etapes:info.etapes||[]}; p.sources.push(s); }
   p.trouvailles.push({id:uid(),type:"animation",animId:d.id,etape:-1,source:s.id,partie:null,date:Date.now()}); sauver(); majChercher(); toast("Animation gardée !"); },

  if(t.id==="filtreSujet"){ S.filtreSujet=t.value; const pos=t.selectionStart; renderProjet(); const i=$("#filtreSujet"); if(i){ i.focus(); i.setSelectionRange(pos,pos); } }
  else if(t.dataset.in==="regDico"){ S.settings.dicos[t.dataset.k]=t.checked; sauverReglages(); } });
document.addEventListener("input",e=>{ const t=e.target; if(t.id==="depot") S.depot=t.innerHTML; else if(t.dataset.in==="qjChamp"){ if(t.dataset.k==="titre") S.depotTitre=t.value; else S.depotUrl=t.value; } });
document.addEventListener("drop",e=>{ const z=e.target.closest&&e.target.closest("#depot,#qjUrl"); if(!z) return;
  const uri=(e.dataTransfer.getData("text/uri-list")||"").split("\n").find(l=>l&&!l.startsWith("#"));
  const html=e.dataTransfer.getData("text/html")||""; const d=document.createElement("div"); d.innerHTML=html; const txt=d.textContent.trim();
  const seulLien=uri&&(!html||(d.querySelectorAll("a").length===1&&txt.length<160&&!d.querySelector("img,table,p")));
  if(uri&&(seulLien||z.id==="qjUrl")){ e.preventDefault(); e.stopPropagation(); S.depotUrl=uri.trim(); $("#qjUrl").value=S.depotUrl; if(txt&&!$("#qjTitre").value){ S.depotTitre=txt.slice(0,120); $("#qjTitre").value=S.depotTitre; }
    toast("Adresse notée. Ouvre la page, copie le passage utile et colle-le dans le cadre."); return; }
  if(uri&&!$("#qjUrl").value){ S.depotUrl=uri.trim(); $("#qjUrl").value=S.depotUrl; }
  setTimeout(()=>{ const dz=$("#depot"); if(dz) S.depot=dz.innerHTML; },50); },true);
document.addEventListener("paste",e=>{ const z=e.target.closest&&e.target.closest("#depot"); if(!z) return; const cd=e.clipboardData;
  const txt=(cd.getData("text/plain")||"").trim(); const html=cd.getData("text/html");
  if(/^https?:\/\/\S+$/.test(txt)&&!html){ e.preventDefault(); S.depotUrl=txt; $("#qjUrl").value=txt; toast("Adresse de la page notée."); return; }
  const f=[...(cd.files||[])].find(x=>/^image\//.test(x.type));
  if(f&&!html){ e.preventDefault(); fichierVersDataURL(f,1400).then(du=>{ document.execCommand("insertHTML",false,`<p><img src="${du}"></p>`); S.depot=z.innerHTML; }); }
  setTimeout(()=>{ S.depot=z.innerHTML; },50); });
